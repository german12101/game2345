<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Глухой сигнал</title>
<style>
:root {
  color-scheme: dark;
  --base: #0b0e13;
  --panel: #111820;
  --line: #25323b;
  --muted: #a3b6ba;
  --text: #e3efea;
  --mint: #9ef5d0;
  --ember: #ff9a76;
  --mono: ui-monospace,"SFMono-Regular",Consolas,monospace;
}
* {
  box-sizing: border-box;
}
html,body {
  margin: 0;
  min-height: 100%;
}
body {
  background: radial-gradient(ellipse at 74% 14%,#172329 0%,transparent 42%),var(--base);
  color: var(--text);
  font: 14px/1.5 system-ui,sans-serif;
}
button {
  color: inherit;
  font: inherit;
  cursor: pointer;
}
button:focus-visible {
  outline: 2px solid #fff;
  outline-offset: 4px;
}
[hidden] {
  display: none!important;
}
.app {
  width: min(1120px,calc(100% - 48px));
  margin: auto;
  padding: 21px 0 15px;
}
.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 14px;
  margin-bottom: 12px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font: 700 12px var(--mono);
  letter-spacing: .15em;
  text-transform: uppercase;
  white-space: nowrap;
}
.mark {
  width: 26px;
  height: 26px;
  display: grid;
  place-items: center;
  border: 1px solid #426059;
  color: var(--mint);
  font-size: 15px;
}
.utility {
  display: flex;
  gap: 8px;
}
.quiet {
  padding: 7px 10px;
  border: 1px solid #30434b;
  background: #141d24;
  font: 700 11px var(--mono);
  white-space: nowrap;
}
.quiet:hover {
  border-color: var(--mint);
}
.hud {
  display: grid;
  grid-template-columns: 1.55fr 1fr 1fr .9fr;
  background: #121b22;
  border: 1px solid var(--line);
  border-bottom: 0;
}
.cell {
  padding: 7px 13px;
  border-right: 1px solid var(--line);
  min-width: 0;
}
.cell:last-child {
  border: 0;
}
.cell small {
  display: block;
  color: var(--muted);
  font: 600 10px var(--mono);
  letter-spacing: .10em;
  text-transform: uppercase;
}
.cell strong {
  font: 800 16px/1.2 var(--mono);
  font-variant-numeric: tabular-nums;
  display: block;
  padding-top: 3px;
  white-space: nowrap;
}
.cell .accent {
  color: var(--mint);
}
.dash-track {
  height: 3px;
  margin-top: 3px;
  background: #293b40;
  max-width: 100px;
}
.dash-fill {
  height: 100%;
  background: var(--mint);
  transform-origin: left;
}
.field {
  position: relative;
  overflow: hidden;
  border: 1px solid #395059;
  aspect-ratio: 45/28;
  background: #0d141a;
  isolation: isolate;
}
canvas {
  display: block;
  width: 100%;
  height: 100%;
  image-rendering: pixelated;
  touch-action: none;
}
.field.live canvas {
  cursor: none;
}
.field::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: repeating-linear-gradient(0deg,#060a1028 0 1px,transparent 1px 5px);
  opacity: .28;
  z-index: 1;
}
.overlay {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  z-index: 2;
  background: #090e13a8;
  padding: 22px;
  overflow: auto;
}
.overlay[data-mode="menu"] {
  justify-items: start;
  background: linear-gradient(90deg,#0b1118 2%,#0b1118ed 31%,#0b111899 55%,#0b11181a 82%);
  padding: clamp(20px,5.6vw,78px);
}
.card {
  width: min(100%,414px);
  padding: 25px;
  border: 1px solid #49635e;
  background: #111b23f5;
  box-shadow: 0 12px 40px #0007;
}
.overlay[data-mode="menu"] .card {
  padding: 0;
  border: 0;
  background: none;
  box-shadow: none;
  width: min(100%,540px);
}
.eyebrow {
  display: flex;
  align-items: center;
  gap: 9px;
  color: var(--mint);
  font: 700 clamp(9px,1.3vw,12px) var(--mono);
  letter-spacing: .14em;
  text-transform: uppercase;
  margin: 0 0 13px;
}
.eyebrow::before {
  content: "";
  width: 20px;
  height: 2px;
  background: currentColor;
}
.overlay h1 {
  font-size: clamp(24px,5vw,47px);
  line-height: .96;
  letter-spacing: -.04em;
  margin: 0;
  white-space: pre-line;
  font-weight: 950;
}
.overlay[data-mode="menu"] h1 {
  font-size: clamp(34px,8.2vw,115px);
  line-height: .80;
  letter-spacing: -.074em;
}
.overlay[data-mode="menu"] h1 span {
  display: block;
  color: var(--mint);
}
.overlay[data-mode="dead"] .eyebrow,.overlay[data-mode="dead"] h1 {
  color: var(--ember);
}
.description {
  color: #c3d4d1;
  max-width: 41ch;
  margin: 15px 0 16px;
  font-size: clamp(12px,1.6vw,16px);
  line-height: 1.45;
}
.overlay[data-mode="menu"] .description {
  margin-top: 22px;
}
.primary,.secondary {
  padding: 9px 14px;
  min-height: 38px;
  font-weight: 850;
  font-size: 13px;
  border: 1px solid var(--mint);
  background: var(--mint);
  color: #0d1b19;
}
.primary:hover {
  background: #d4ffeb;
}
.secondary {
  background: #101820;
  border-color: #435f62;
  color: var(--text);
}
.secondary:hover {
  border-color: var(--mint);
}
.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.hint {
  color: #a7bbbb;
  font: 11px/1.4 var(--mono);
  margin: 10px 0 0;
}
.overlay[data-mode="reward"] .card,
.overlay[data-mode="armory"] .card {
  width: min(100%, 620px);
}
.overlay[data-mode="story"] .card {
  width: min(100%, 550px);
  border-left: 3px solid var(--mint);
  background: linear-gradient(130deg, #1a2e33, #101923 74%);
}
.overlay[data-mode="story"] .description,
.overlay[data-mode="win"] .description {
  max-width: 52ch;
  white-space: pre-line;
}
.cell .accent[data-empty="true"] {
  color: var(--ember);
}
.rewards {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
  margin: 12px 0;
}
.reward {
  display: grid;
  align-content: start;
  text-align: left;
  gap: 5px;
  min-width: 0;
  padding: 11px;
  border: 1px solid #456764;
  background: #192b32;
}
.reward:hover {
  border-color: var(--mint);
  background: #233942;
}
.reward strong {
  color: var(--mint);
  font-size: 13px;
}
.reward span {
  color: #bdcfce;
  font-size: 11px;
}
.armory-list {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 7px;
  margin: 9px 0;
}
.armory-list .reward[data-equipped="true"] {
  border-color: var(--mint);
}
.armory-list .quiet {
  white-space: normal;
  padding: 5px 7px;
}
.armory-list button:disabled {
  opacity: .6;
  cursor: default;
}
.modules {
  color: #bed4ce;
  padding: 6px 11px;
  border: 1px solid var(--line);
  border-top: 0;
  background: #10191e;
  font: 11px/1.4 var(--mono);
}
.callout {
  position: absolute;
  z-index: 1;
  pointer-events: none;
  left: 50%;
  bottom: 15px;
  transform: translateX(-50%);
  white-space: nowrap;
  background: #10211fec;
  color: var(--mint);
  border: 1px solid #72b69c;
  padding: 5px 10px;
  font: 700 clamp(9px,1.6vw,12px) var(--mono);
  box-shadow: 0 0 15px #101a20;
}
.callout[data-kind="dry"] {
  color: #ffd1b6;
  border-color: #da8c69;
  background: #291a1af2;
}
.rail {
  display: flex;
  justify-content: space-between;
  gap: 14px;
  padding: 8px 11px;
  border: 1px solid var(--line);
  border-top: 0;
  background: #111920;
  color: var(--muted);
  font: 700 11px var(--mono);
}
.rail > span:last-child {
  text-align: right;
}
.keys {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 7px 17px;
  color: #a8b8ba;
  padding: 13px 0 0;
  font-size: 11px;
}
kbd {
  font: 700 10px var(--mono);
  display: inline-block;
  color: #d9ebe4;
  border: 1px solid #344752;
  border-bottom-width: 2px;
  padding: 1px 4px;
  margin-right: 4px;
  background: #151e26;
}
@media(min-width:860px) and (max-height:900px) {
  .app {
    width: min(1120px,calc((100vh - 190px)*45/28),calc(100% - 48px));
  }
}
@media(max-width:600px) {
  .app {
    width: calc(100% - 16px);
    padding-top: 8px;
  }
  .top {
    margin-bottom: 7px;
  }
  .brand {
    font-size: 10px;
    letter-spacing: .055em;
  }
  .mark {
    width: 22px;
    height: 22px;
  }
  .utility {
    gap: 4px;
  }
  .quiet {
    padding: 5px 6px;
    font-size: 9px;
  }
  .cell {
    padding: 5px;
  }
  .cell small {
    font-size: 8px;
    letter-spacing: 0;
  }
  .cell strong {
    font-size: 11px;
  }
  .rail {
    font-size: 9px;
    padding: 5px;
  }
  .field {
    min-height: 215px;
  }
  .overlay {
    padding: 8px;
  }
  .card {
    padding: 12px;
  }
  .eyebrow {
    margin-bottom: 8px;
  }
  .overlay[data-mode="menu"] .description,.description {
    margin: 8px 0;
  }
  .hint {
    margin-top: 5px;
  }
  .keys {
    gap: 4px 8px;
    padding-top: 8px;
  }
  .reward {
    padding: 5px;
  }
  .reward strong {
    font-size: 10px;
  }
  .reward span {
    font-size: 9px;
  }
}
@media(prefers-reduced-motion:reduce) {
  .field::after {
    opacity: .12;
  }
}
</style>
</head>

<main class="app">
  <header class="top">
    <div class="brand"><span class="mark" aria-hidden="true">⌁</span> Ретранслятор «Нерпа»</div>
    <div class="utility">
      <button class="quiet" id="sound" type="button" aria-label="Переключить звук">ЗВУК ВКЛ</button>

    </div>
  </header>
  <div class="hud" aria-label="Состояние игры">
    <div class="cell"><small>Сектор / Волна</small><strong id="sector">— / 05</strong></div>
    <div class="cell"><small>Заряды</small><strong id="ammo" class="accent">—</strong></div>
    <div class="cell"><small>Очки</small><strong id="score">00000</strong></div>
    <div class="cell"><small>Рывок</small><strong id="dash">—</strong><div class="dash-track"><div id="dashFill" class="dash-fill"></div></div></div>
  </div>
  <div class="field" id="field">
    <canvas id="screen" width="720" height="448" aria-label="Игровое поле"></canvas>
    <div class="callout" id="callout" hidden></div>
    <div class="overlay" id="overlay" hidden>
      <div class="card" role="dialog" aria-labelledby="headline" aria-describedby="description">
        <p id="eyebrow" class="eyebrow"></p>
        <h1 id="headline"></h1>
        <p id="description" class="description"></p>
        <div class="rewards" id="rewards" aria-label="Выбор модуля" hidden></div>
        <div class="armory-list" id="armory" aria-label="Оружие" hidden></div>
        <div class="actions">
          <button type="button" id="primary" class="primary"></button>
          <button type="button" id="secondary" class="secondary" hidden></button>
          <button type="button" id="tertiary" class="secondary" hidden></button>
        </div>
        <p id="hint" class="hint"></p>
      </div>
    </div>
  </div>
  <div class="rail"><span id="objective">Связь со станцией потеряна</span><span id="clock">РЕКОРД 00000</span></div>
  <div class="modules" id="modules" hidden></div>
  <div class="keys" aria-label="Управление">
    <span><kbd>WASD</kbd>движение</span>
    <span><kbd>ЛКМ / J</kbd>огонь</span>

    <span><kbd>R</kbd>рестарт сектора</span>
    <span><kbd>ESC</kbd>пауза</span>

</main>

  osc.frequency.exponentialRampToValueAtTime(Math.max(15, to), at + duration);
  gain.gain.setValueAtTime(volume, at);
  gain.gain.exponentialRampToValueAtTime(.0001, at + duration);

  osc.start(at);
  osc.stop(at + duration);
}

  filter.frequency.value = frequency;
  gain.gain.setValueAtTime(volume, at);
  gain.gain.exponentialRampToValueAtTime(.0001, at + duration);
  source.connect(filter).connect(gain).connect(audio.destination);
  source.start(at);
  source.stop(at + duration);
}

    case "foe": tone("triangle", 130, 73, .09, .055, at); break;
    case "hit": noise(520, .11, .13, at); tone("square", 97, 40, .1, .045, at); break;
    case "dash": noise(800, .11, .08, at); tone("triangle", 105, 350, .14, .04, at); break;
    case "dry":
      noise(2100, .026, .115, at);
      tone("triangle", 610, 245, .037, .065, at);

    case "pickup": tone("sine", 450, 730, .16, .052, at); break;

  const step = beat++ % 16;

  const y = clamp(pointer.y, 6, HEIGHT - 6);
  const gap = p.fire > .09 ? 5 : 3;
  for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
    line(ctx, "#0c171c", x + dx * gap, y + dy * gap, x + dx * (gap + 5), y + dy * (gap + 5), 3);
    line(ctx, color, x + dx * gap, y + dy * gap, x + dx * (gap + 4), y + dy * (gap + 4));
  }
  rect(ctx, color, x, y, 1, 1);
}
function drawRadar() {
  const scale = 1 / 12;
  const w = game.width * scale;
  const h = game.height * scale;
  const x = WIDTH - w - 13;
  const y = 13;
  rect(ctx, "#07141fea", x - 3, y - 3, w + 6, h + 6);
  ctx.strokeStyle = "#82b3a995";
  ctx.strokeRect(x, y, w, h);
  ctx.strokeStyle = "#a8d1c051";
  ctx.strokeRect(x + game.camera.x * scale, y + game.camera.y * scale, WIDTH * scale, HEIGHT * scale);
  for (const enemy of game.enemies) {
    if (!enemy.dead) rect(ctx, enemy.delay > 0 ? "#dfab7a88" : "#ffac91", x + enemy.x * scale, y + enemy.y * scale, 2, 2);
  }
  rect(ctx, "#adffda", x + game.p.x * scale - 1, y + game.p.y * scale - 1, 3, 3);
}
function render(t) {
  if (!game.level) {
    drawCover(t);
    return;
  }
  ctx.fillStyle = "#0b151d";
  ctx.fillRect(0, 0, WIDTH, HEIGHT);
  ctx.save();
  if (game.shake > 0 && !motion.matches) {
    ctx.translate(Math.round((Math.random() - .5) * game.shake * 2), Math.round((Math.random() - .5) * game.shake * 2));
  }
  ctx.translate(-game.camera.x, -game.camera.y);
  ctx.drawImage(floor, 0, 0);
  if (!survival()) drawExit(t);
  for (const e of game.enemies) if (e.dead) drawBot(e, t);
  for (const p of game.pickups) drawPickup(p, t);
  for (const trail of game.trails) {
    ctx.save();
    ctx.globalAlpha = trail.life / .19 * .56;
    ctx.translate(trail.x, trail.y);
    ctx.rotate(trail.angle);
    rect(ctx, "#83f7d0", -8, -7, 16, 14);
    ctx.restore();
  }
  for (const e of game.enemies) if (!e.dead) drawBot(e, t);
  drawOperator(game.p);
  for (const bolt of game.bolts) {
    const len = bolt.friendly ? .019 : .029;
    const size = bolt.size || 0;
    line(ctx, bolt.color + "83", bolt.x, bolt.y, bolt.x - bolt.vx * len, bolt.y - bolt.vy * len, 5 + size);
    line(ctx, bolt.color, bolt.x, bolt.y, bolt.x - bolt.vx * len, bolt.y - bolt.vy * len, 2 + size);
  }
  for (const p of game.particles) {
    ctx.globalAlpha = p.life / p.max;
    rect(ctx, p.color, p.x, p.y, p.size, p.size);
  }
  for (const popup of game.popups) {
    ctx.globalAlpha = Math.min(1, popup.life * 4);
    label(ctx, "#0b1420", popup.text, popup.x - 13, popup.y + 1, 10);
    label(ctx, "#e5ffd3", popup.text, popup.x - 14, popup.y, 10);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
  if (game.mode === "live") {
    if (survival()) drawRadar();
    drawCrosshair();
  }
}

function setText(element, value) {
  if (element.textContent !== value) element.textContent = value;
}
function updateHud() {
  const briefing = game.mode === "story";
  if (!game.level || briefing) {
    setText(ui.sector, briefing ? `0${game.briefIndex + 1} / 05  ${levels[game.briefIndex].name}` : "— / 05");
    setText(ui.ammo, "—");
    ui.ammo.dataset.empty = "false";
    setText(ui.dash, "—");
    setText(ui.score, scoreText(briefing ? game.score : 0));
    setText(ui.objective, `Оружие · ${weapons[record.equipped].name} ур. ${record.inventory[record.equipped]}`);
    setText(ui.clock, `КАМПАНИЯ ${scoreText(record.score)}  •  ВОЛН ${record.waveBest}`);
    ui.dashFill.style.transform = "scaleX(0)";
    ui.callout.hidden = true;
    ui.modules.hidden = true;
    return;
  }
  const p = game.p;
  const foes = game.enemies.filter(e => !e.dead).length;
  const campaign = !survival();
  setText(ui.sector, campaign ? `0${game.stage + 1} / 05  ${game.level.name}` : `ВОЛНА ${game.wave}`);
  setText(ui.ammo, `${String(p.ammo).padStart(2, "0")} / ${ammoLimit()}`);
  ui.ammo.dataset.empty = String(p.ammo === 0);
  setText(ui.score, scoreText(game.score));
  setText(ui.dash, p.cooldown > 0 ? Math.max(.1, p.cooldown).toFixed(1) + " С" : "ГОТОВ");
  ui.dashFill.style.transform = `scaleX(${1 - p.cooldown / dashCooldown()})`;
  const bossStatus = game.enemies.find(enemy => enemy.kind === "boss" && !enemy.dead);
  const target = bossStatus
    ? `Смотритель: ${bossStatus.phase === "open" ? "уязвим" : "под щитом"} · ${bossStatus.health}/${bossStatus.maxHealth}`
    : `Мехов ${foes}`;
  setText(ui.objective, game.open ? (campaign ? "Шлюз открыт" : "Волна отбита") : target);
  setText(ui.clock, campaign
    ? `${timeText(game.elapsed)}  •  РЕКОРД ${scoreText(record.score)}`
    : `${timeText(game.elapsed)}  •  РЕКОРД ${record.waveBest} ВОЛН`);
  const active = modules.filter(module => rank(module.id)).map(module => {
    if (module.id === "shield" && !p.shield) return "Предохранитель (расход)";
    return module.name + (rank(module.id) > 1 ? " ×" + rank(module.id) : "");
  });
  const loadout = `${game.weapon.name} · ур. ${game.weapon.level}`;
  if (campaign && game.stage >= 3) active.unshift("Серия 07");
  setText(ui.modules, [loadout, ...active].join("  •  "));
  ui.modules.hidden = false;
  const dryWarning = game.mode === "live" && !p.ammo && p.dryFeedback > 0;
  ui.callout.hidden = !dryWarning;
  ui.callout.dataset.kind = dryWarning ? "dry" : "exit";
  if (dryWarning) setText(ui.callout, "НЕТ ЗАРЯДОВ · КАССЕТА ИЛИ РЫВОК");
  if (campaign && game.mode === "live") {
    const [x, y] = game.level.exit;
    const near = Math.hypot(p.x - x, p.y - y) < 30 && sight(p.x, p.y, x, y);
    if (near && (game.open || !dryWarning)) {
      ui.callout.hidden = false;
      ui.callout.dataset.kind = "exit";
      setText(ui.callout, game.open ? (game.stage === levels.length - 1 ? "E  ПЕРЕДАТЬ АРХИВ" : "E  ПРОЙТИ ШЛЮЗ") : "ШЛЮЗ ЗАБЛОКИРОВАН");
    }
  }
}
function frame(now) {
  const dt = game.lastFrame ? Math.min(.05, (now - game.lastFrame) / 1000) : 0;
  game.lastFrame = now;
  game.worldTime += dt;
  if (game.mode === "live") {
    game.accumulator += dt;
    while (game.accumulator >= STEP && game.mode === "live") {
      update(STEP);
      game.accumulator -= STEP;
    }
  } else game.accumulator = 0;
  updateEffects(dt);
  music();
  render(game.worldTime);
  updateHud();
  requestAnimationFrame(frame);
}

function aimFrom(event) {
  const bounds = canvas.getBoundingClientRect();
  if (!bounds.width || !bounds.height) return;
  pointer.clientX = event.clientX;
  pointer.clientY = event.clientY;
  pointer.x = (event.clientX - bounds.left) * WIDTH / bounds.width;
  pointer.y = (event.clientY - bounds.top) * HEIGHT / bounds.height;
}
function reprojectPointer() {
  if (Number.isFinite(pointer.clientX)) aimFrom(pointer);
}
function releasePointer() {
  const id = pointer.id;
  pointer.id = null;
  pointer.held = false;
  if (id !== null && canvas.hasPointerCapture?.(id)) {
    try { canvas.releasePointerCapture(id); }
    catch { /* The browser may have already cancelled the physical press. */ }
  }
}
function nativePointer(event) {
  return event.isPrimary !== false && event.pointerType !== "touch";
}
function pointerDown(event) {
  if (game.mode !== "live" || !nativePointer(event) || (event.button !== 0 && event.button !== 2)) return;
  event.preventDefault();
  aimFrom(event);
  if (event.button === 2 || event.ctrlKey) {
    dash();
    return;
  }
  pointer.held = true;
  pointer.id = event.pointerId ?? null;
  if (pointer.id !== null) {
    try { canvas.setPointerCapture?.(pointer.id); }
    catch { /* Window listeners also handle release where pointer capture is unavailable. */ }
  }
  triggerFire();
}
function pointerMove(event) {
  if (!nativePointer(event)) return;
  aimFrom(event);
  if (game.mode !== "live") return;
  if (pointer.held && !(event.buttons & 1)) releasePointer();
  if (event.button === 2 && (event.buttons & 2)) dash();
}
function pointerUp(event) {
  if (!nativePointer(event)) return;
  if (pointer.id !== null && event.pointerId !== pointer.id) return;
  if (event.button === 0 || !(event.buttons & 1)) releasePointer();
}
if (window.PointerEvent) {
  canvas.addEventListener("pointerdown", pointerDown);
  window.addEventListener("pointermove", pointerMove);
  window.addEventListener("pointerup", pointerUp, true);
  window.addEventListener("pointercancel", event => { if (event.pointerId === pointer.id) releasePointer(); }, true);
  canvas.addEventListener("lostpointercapture", event => { if (event.pointerId === pointer.id) releasePointer(); });
} else {
  canvas.addEventListener("mousedown", pointerDown);
  window.addEventListener("mousemove", pointerMove);
  window.addEventListener("mouseup", pointerUp, true);
}
document.documentElement.addEventListener("mouseleave", releasePointer);
window.addEventListener("resize", reprojectPointer);
window.addEventListener("scroll", reprojectPointer, { passive: true });
canvas.addEventListener("contextmenu", event => event.preventDefault());

const moveKeys = new Set(["KeyW", "KeyA", "KeyS", "KeyD", "ArrowUp", "ArrowLeft", "ArrowDown", "ArrowRight"]);
const keyFallback = {
  w: "KeyW", ц: "KeyW", a: "KeyA", ф: "KeyA", s: "KeyS", ы: "KeyS",
  d: "KeyD", в: "KeyD", j: "KeyJ", о: "KeyJ", e: "KeyE", у: "KeyE",
  r: "KeyR", к: "KeyR", p: "KeyP", з: "KeyP", m: "KeyM", ь: "KeyM",
  " ": "Space", shift: "ShiftLeft", "1": "Digit1", "2": "Digit2", "3": "Digit3"
};
function inputCode(event) {
  if (event.code && event.code !== "Unidentified") return event.code;
  const key = event.key || "";
  return keyFallback[key.toLowerCase()] || key;
}
window.addEventListener("keydown", event => {
  if (event.metaKey || event.ctrlKey || event.altKey || event.isComposing) return;
  const code = inputCode(event);
  const live = game.mode === "live";
  if (live && (moveKeys.has(code) || code === "KeyJ")) {
    event.preventDefault();
    if (code === "KeyJ" && !keys.has(code)) triggerFire();
    keys.add(code);
    return;
  }
  if (live && code === "Space") event.preventDefault();
  if (event.repeat) return;
  if (code === "KeyM") toggleMute();
  if (code === "KeyR" && ["live", "dead", "pause"].includes(game.mode)) restart();
  if (code === "Enter" && !live && !(event.target instanceof HTMLButtonElement)) game.primaryAction?.();
  if (game.mode === "reward" && /^(Digit|Numpad)[1-3]$/.test(code)) {
    event.preventDefault();
    chooseReward(Number(code.at(-1)) - 1);
  }
  if (code === "Escape" || code === "KeyP") {
    if (live) pause();
    else if (game.mode === "pause") resume();
    else if (game.mode === "armory") game.armoryReturn?.();
    else if (game.mode === "story" && code === "Escape") game.primaryAction?.();
  }
  if (live && ["Space", "ShiftLeft", "ShiftRight"].includes(code)) dash();
  if (live && code === "KeyE") interact();
});
window.addEventListener("keyup", event => keys.delete(inputCode(event)));
function loseFocus() {
  keys.clear();
  releasePointer();
  if (game.mode === "live") pause();
}
window.addEventListener("blur", loseFocus);
document.addEventListener("visibilitychange", () => {
  if (document.hidden) loseFocus();
});
ui.primary.addEventListener("click", () => game.primaryAction?.());
ui.secondary.addEventListener("click", () => game.secondaryAction?.());
ui.tertiary.addEventListener("click", () => game.tertiaryAction?.());
ui.sound.addEventListener("click", toggleMute);
if (document.fullscreenEnabled) {
  ui.fullscreen.addEventListener("click", async () => {
    try {
      if (document.fullscreenElement) await document.exitFullscreen();
      else await document.documentElement.requestFullscreen();
    } catch { ui.fullscreen.blur(); }
  });
  document.addEventListener("fullscreenchange", () => {
    ui.fullscreen.textContent = document.fullscreenElement ? "СВЕРНУТЬ" : "ПОЛНЫЙ ЭКРАН";
    reprojectPointer();
  });
} else ui.fullscreen.hidden = true;


menu();
requestAnimationFrame(frame);
</script>
</body>
</html>
