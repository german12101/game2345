<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Глухой сигнал</title>
<style>
:root {
  color-scheme: dark;
  --base: #0b0e13;
  --panel: #111820;
  --line: #25323b;
  --muted: #a3b6ba;
  --text: #e3efea;
  --mint: #9ef5d0;
  --ember: #ff9a76;
  --glow: #172329;
  --mono: ui-monospace,"SFMono-Regular",Consolas,monospace;
}
:root[data-theme="violet"] {
  --base: #120e1c;
  --line: #473657;
  --mint: #e5baff;
  --glow: #301e45;
}
:root[data-theme="amber"] {
  --base: #18120d;
  --line: #504031;
  --mint: #ffd18b;
  --glow: #39281a;
}
:root[data-theme="contrast"] {
  --base: #05080c;
  --line: #556471;
  --mint: #befff9;
  --glow: #1b2c36;
}
* {
  box-sizing: border-box;
}
html,body {
  margin: 0;
  min-height: 100%;
}
body {
  background: radial-gradient(ellipse at 74% 14%,var(--glow) 0%,transparent 42%),var(--base);
  color: var(--text);
  font: 14px/1.5 system-ui,sans-serif;
}
button {
  color: inherit;
  font: inherit;
  cursor: pointer;
}
button:focus-visible {
  outline: 2px solid #fff;
  outline-offset: 4px;
}
[hidden] {
  display: none!important;
}
.app {
  width: min(1120px,calc(100% - 48px));
  margin: auto;
  padding: 21px 0 15px;
}
.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 14px;
  margin-bottom: 12px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font: 700 12px var(--mono);
  letter-spacing: .15em;
  text-transform: uppercase;
  white-space: nowrap;
}
.utility {
  display: flex;
  gap: 8px;
}
.quiet {
  padding: 7px 10px;
  border: 1px solid #30434b;
  background: #141d24;
  font: 700 11px var(--mono);
  white-space: nowrap;
}
.quiet:hover {
  border-color: var(--mint);
}
.menu-button {
  border-color: var(--mint);
  background: var(--mint);
  color: #0c2020;
  letter-spacing: .06em;
  min-height: 34px;
}
.menu-button:hover {
  background: #d7ffee;
}
.hud {
  display: grid;
  grid-template-columns: 1.55fr 1fr .8fr .9fr .9fr;
  background: #121b22;
  border: 1px solid var(--line);
  border-bottom: 0;
}
.cell {
  padding: 7px 13px;
  border-right: 1px solid var(--line);
  min-width: 0;
}
.cell:last-child {
  border: 0;
}
.cell small {
  display: block;
  color: var(--muted);
  font: 600 10px var(--mono);
  letter-spacing: .10em;
  text-transform: uppercase;
}
.cell strong {
  font: 800 16px/1.2 var(--mono);
  font-variant-numeric: tabular-nums;
  display: block;
  padding-top: 3px;
  white-space: nowrap;
}
.cell .accent {
  color: var(--mint);
}
.dash-track {
  height: 3px;
  margin-top: 3px;
  background: #293b40;
  max-width: 100px;
}
.dash-fill {
  height: 100%;
  background: var(--mint);
  transform-origin: left;
}
.field {
  position: relative;
  overflow: hidden;
  border: 1px solid #395059;
  aspect-ratio: 45/28;
  background: #0d141a;
  isolation: isolate;
}
canvas {
  display: block;
  width: 100%;
  height: 100%;
  image-rendering: pixelated;
  touch-action: none;
}
#stage3d {
  position: absolute;
  inset: 0;
  pointer-events: none;
  image-rendering: auto;
}
#screen {
  position: relative;
}
.field.live canvas {
  cursor: none;
}
.field::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: repeating-linear-gradient(0deg,#060a1028 0 1px,transparent 1px 5px);
  opacity: .28;
  z-index: 1;
}
.overlay {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  z-index: 2;
  background: #090e13a8;
  padding: 22px;
  overflow: auto;
}
.overlay[data-mode="menu"] {
  justify-items: start;
  background: linear-gradient(90deg,#0b1118 2%,#0b1118ed 31%,#0b111899 55%,#0b11181a 82%);
  padding: clamp(20px,5.6vw,78px);
}
.card {
  width: min(100%,414px);
  padding: 25px;
  border: 1px solid #49635e;
  background: #111b23f5;
  box-shadow: 0 12px 40px #0007;
}
.overlay[data-mode="menu"] .card {
  padding: 0;
  border: 0;
  background: none;
  box-shadow: none;
  width: min(100%,540px);
}
.eyebrow {
  display: flex;
  align-items: center;
  gap: 9px;
  color: var(--mint);
  font: 700 clamp(9px,1.3vw,12px) var(--mono);
  letter-spacing: .14em;
  text-transform: uppercase;
  margin: 0 0 13px;
}
.eyebrow::before {
  content: "";
  width: 20px;
  height: 2px;
  background: currentColor;
}
.overlay h1 {
  font-size: clamp(24px,5vw,47px);
  line-height: .96;
  letter-spacing: -.04em;
  margin: 0;
  white-space: pre-line;
  font-weight: 950;
}
.overlay[data-mode="menu"] h1 {
  font-size: clamp(34px,8.2vw,115px);
  line-height: .80;
  letter-spacing: -.074em;
}
.overlay[data-mode="menu"] h1 span {
  display: block;
  color: var(--mint);
}
.overlay[data-mode="dead"] .eyebrow,.overlay[data-mode="dead"] h1 {
  color: var(--ember);
}
.description {
  color: #c3d4d1;
  max-width: 41ch;
  margin: 15px 0 16px;
  font-size: clamp(12px,1.6vw,16px);
  line-height: 1.45;
}
.overlay[data-mode="menu"] .description {
  margin-top: 22px;
}
.primary,.secondary {
  padding: 9px 14px;
  min-height: 38px;
  font-weight: 850;
  font-size: 13px;
  border: 1px solid var(--mint);
  background: var(--mint);
  color: #0d1b19;
}
.primary:hover {
  background: #d4ffeb;
}
.secondary {
  background: #101820;
  border-color: #435f62;
  color: var(--text);
}
.secondary:hover {
  border-color: var(--mint);
}
.overlay[data-mode="menu"] #quaternary {
  border-color: var(--mint);
  color: var(--mint);
}
.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.hint {
  color: #a7bbbb;
  font: 11px/1.4 var(--mono);
  margin: 10px 0 0;
}
.overlay[data-mode="reward"] .card,
.overlay[data-mode="armory"] .card,
.overlay[data-mode="settings"] .card,
.overlay[data-mode="gear"] .card,
.overlay[data-mode="companions"] .card,
.overlay[data-mode="ending"] .card {
  width: min(100%, 620px);
}
.overlay[data-mode="companions"] #options {
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
}
.overlay[data-mode="companions"] {
  align-items: safe center;
}
.companion-icon {
  width: 38px;
  height: 38px;
  image-rendering: pixelated;
  align-self: center;
}
.overlay[data-mode="story"] .card {
  width: min(100%, 550px);
  border-left: 3px solid var(--mint);
  background: linear-gradient(130deg, #1a2e33, #101923 74%);
}
.overlay[data-mode="story"] .description,
.overlay[data-mode="win"] .description {
  max-width: 52ch;
  white-space: pre-line;
}
.overlay[data-cinematic="true"] {
  justify-items: start;
  align-items: safe center;
  padding: clamp(16px, 3.8vw, 56px);
  background: linear-gradient(90deg, #071017ef 0%, #071017df 37%, #07101745 62%, #07101704 100%);
}
.overlay[data-cinematic="true"] .card {
  width: min(55%, 465px);
  padding: clamp(13px, 2vw, 25px);
  border: 0;
  border-left: 2px solid var(--mint);
  background: #101923d9;
  box-shadow: none;
  animation: scene-enter .23s ease-out both;
}
.overlay[data-cinematic="true"] .description {
  white-space: pre-line;
}
.overlay[data-cinematic="true"] h1 {
  font-size: clamp(19px, 3.4vw, 39px);
}
@keyframes scene-enter {
  from { opacity: .7; transform: translateX(-6px); }
  to { opacity: 1; transform: translateX(0); }
}
.overlay[data-film="playing"] {
  place-items: end end;
  padding: clamp(10px, 2.4vw, 25px);
  background: linear-gradient(180deg, transparent 70%, #0810198f);
}
.overlay[data-film="playing"] .card {
  width: auto;
  padding: 0;
  border: 0;
  background: transparent;
}
.overlay[data-film="playing"] .card > :not(.actions),
.overlay[data-film="playing"] .actions > :not(#tertiary) {
  display: none;
}
.cell .accent[data-empty="true"] {
  color: var(--ember);
}
#lives {
  color: #ff9aab;
  letter-spacing: .13em;
}
#lives[data-empty="true"] {
  color: var(--muted);
}
.overlay[data-mode="sectors"] .card {
  width: min(100%, 620px);
}
.sector-list {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
  gap: 7px;
  margin: 12px 0;
}
.sector-list .reward {
  min-height: 76px;
}
.sector-list .reward[data-status="cleared"] {
  border-color: var(--mint);
  background: #294441;
}
.sector-list .reward[data-status="available"] {
  border-color: #e7bf83;
  background: #3a3229;
}
.sector-list .reward[data-status="available"] strong {
  color: #ffe2ab;
}
.sector-list .reward:disabled {
  opacity: .58;
  cursor: default;
}
.rewards {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
  margin: 12px 0;
}
.reward {
  display: grid;
  align-content: start;
  text-align: left;
  gap: 5px;
  min-width: 0;
  padding: 11px;
  border: 1px solid #456764;
  background: #192b32;
}
.reward:hover {
  border-color: var(--mint);
  background: #233942;
}
.reward strong {
  color: var(--mint);
  font-size: 13px;
}
.reward span {
  color: #bdcfce;
  font-size: 11px;
}
.armory-list {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 7px;
  margin: 9px 0;
}
.armory-list .reward[data-equipped="true"] {
  border-color: var(--mint);
}
.armory-list button[aria-pressed="true"] {
  border-color: var(--mint);
}
.option-heading {
  grid-column: 1 / -1;
  color: var(--muted);
  font: 700 11px var(--mono);
}
.armory-list .quiet {
  white-space: normal;
  padding: 5px 7px;
}
.armory-list button:disabled {
  opacity: .6;
  cursor: default;
}
.modules {
  color: #bed4ce;
  padding: 6px 11px;
  border: 1px solid var(--line);
  border-top: 0;
  background: #10191e;
  font: 11px/1.4 var(--mono);
}
.callout {
  position: absolute;
  z-index: 1;
  pointer-events: none;
  left: 50%;
  bottom: 15px;
  transform: translateX(-50%);
  white-space: nowrap;
  background: #10211fec;
  color: var(--mint);
  border: 1px solid #72b69c;
  padding: 5px 10px;
  font: 700 clamp(9px,1.6vw,12px) var(--mono);
  box-shadow: 0 0 15px #101a20;
}
.callout[data-kind="dry"] {
  color: #ffd1b6;
  border-color: #da8c69;
  background: #291a1af2;
}
.rail {
  display: flex;
  justify-content: space-between;
  gap: 14px;
  padding: 8px 11px;
  border: 1px solid var(--line);
  border-top: 0;
  background: #111920;
  color: var(--muted);
  font: 700 11px var(--mono);
}
.rail > span:last-child {
  text-align: right;
}
.keys {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 7px 17px;
  color: #a8b8ba;
  padding: 13px 0 0;
  font-size: 11px;
}
kbd {
  font: 700 10px var(--mono);
  display: inline-block;
  color: #d9ebe4;
  border: 1px solid #344752;
  border-bottom-width: 2px;
  padding: 1px 4px;
  margin-right: 4px;
  background: #151e26;
}
@media(min-width:860px) and (max-height:900px) {
  .app {
    width: min(1120px,calc((100vh - 190px)*45/28),calc(100% - 48px));
  }
}
@media(max-width:600px) {
  .app {
    width: calc(100% - 16px);
    padding-top: 8px;
  }
  .top {
    margin-bottom: 7px;
  }
  .brand {
    font-size: 10px;
    letter-spacing: .055em;
  }
  .utility {
    gap: 4px;
  }
  .brand > .station-name {
    display: none;
  }
  #fullscreen {
    display: none;
  }
  .quiet {
    padding: 5px 6px;
    font-size: 9px;
  }
  .cell {
    padding: 5px;
  }
  .cell small {
    font-size: 8px;
    letter-spacing: 0;
  }
  .cell strong {
    font-size: 11px;
  }
  .rail {
    font-size: 9px;
    padding: 5px;
  }
  .field {
    min-height: 215px;
  }
  .overlay {
    padding: 8px;
  }
  .card {
    padding: 12px;
  }
  .eyebrow {
    margin-bottom: 8px;
  }
  .overlay[data-mode="menu"] .description,.description {
    margin: 8px 0;
  }
  .hint {
    margin-top: 5px;
  }
  .keys {
    gap: 4px 8px;
    padding-top: 8px;
  }
  .reward {
    padding: 5px;
  }
  .reward strong {
    font-size: 10px;
  }
  .reward span {
    font-size: 9px;
  }
  .field[data-cinematic="true"] {
    min-height: 330px;
  }
  .overlay[data-cinematic="true"] {
    place-items: end stretch;
    padding: 10px;
    background: linear-gradient(180deg, #07101912, #0b141cc9 36%, #0b141cf0 70%);
  }
  .overlay[data-cinematic="true"] .card {
    width: 100%;
    padding: 11px;
  }
  .overlay[data-film="playing"] {
    place-items: end end;
    background: linear-gradient(180deg, transparent 70%, #0810198f);
  }
  .overlay[data-film="playing"] .card {
    width: auto;
    padding: 0;
  }
}
@media(prefers-reduced-motion:reduce) {
  .field::after {
    opacity: .12;
  }
  .overlay[data-cinematic="true"] .card {
    animation: none;
  }
}
</style>
</head>
<body>
<main class="app">
  <header class="top">
    <div class="brand">
      <button class="quiet menu-button" id="mainMenu" type="button" aria-label="Главное меню">☰ МЕНЮ</button>
      <span class="station-name">Ретранслятор «Нерпа»</span>
    </div>
    <div class="utility">
      <button class="quiet" id="sound" type="button" aria-label="Переключить звук">ЗВУК ВКЛ</button>
      <button class="quiet" id="settings" type="button">НАСТРОЙКИ</button>
      <button class="quiet" id="fullscreen" type="button">ПОЛНЫЙ ЭКРАН</button>
    </div>
  </header>
  <div class="hud" aria-label="Состояние игры">
    <div class="cell"><small>Сектор / Уровень</small><strong id="sector">— / 05</strong></div>
    <div class="cell"><small id="ammoLabel">Заряды</small><strong id="ammo" class="accent">—</strong></div>
    <div class="cell"><small>Жизни</small><strong id="lives" data-empty="true">—</strong></div>
    <div class="cell"><small>Очки</small><strong id="score">00000</strong></div>
    <div class="cell"><small id="dashLabel">Рывок</small><strong id="dash">—</strong><div class="dash-track"><div id="dashFill" class="dash-fill"></div></div></div>
  </div>
  <div class="field" id="field">
    <canvas id="stage3d" aria-hidden="true" hidden></canvas>
    <canvas id="screen" width="720" height="448" aria-label="Игровое поле"></canvas>
    <div class="callout" id="callout" hidden></div>
    <div class="overlay" id="overlay" hidden>
      <div class="card" role="dialog" aria-labelledby="headline" aria-describedby="description">
        <p id="eyebrow" class="eyebrow"></p>
        <h1 id="headline"></h1>
        <p id="description" class="description"></p>
        <div class="rewards" id="rewards" aria-label="Выбор модуля" hidden></div>
        <div class="armory-list" id="armory" aria-label="Оружие" hidden></div>
        <div class="armory-list" id="options" hidden></div>
        <div class="sector-list" id="sectorList" aria-label="Секторы кампании" hidden></div>
        <div class="actions">
          <button type="button" id="primary" class="primary"></button>
          <button type="button" id="secondary" class="secondary" hidden></button>
          <button type="button" id="companions" class="secondary" hidden></button>
          <button type="button" id="bonusRide" class="secondary" hidden>Бонус · Побег на гидроцикле</button>
          <button type="button" id="tertiary" class="secondary" hidden></button>
          <button type="button" id="quaternary" class="secondary" hidden></button>
        </div>
        <p id="hint" class="hint"></p>
      </div>
    </div>
  </div>
  <div class="rail"><span id="objective">Связь со станцией потеряна</span><span id="clock">РЕКОРД 00000</span></div>
  <div class="modules" id="modules" hidden></div>
  <div class="keys" id="keysHelp" aria-label="Управление">
    <span><kbd>WASD</kbd>движение</span>
    <span><kbd>ЛКМ / J</kbd>огонь</span>
    <span><kbd>ПРОБЕЛ / SHIFT</kbd>рывок по прицелу</span>
    <span id="hackControl" hidden><kbd>F → ПРОБЕЛ</kbd>перехват меха</span>
    <span><kbd>E</kbd>шлюз</span>
    <span><kbd>R</kbd>рестарт сектора</span>
    <span><kbd>ESC</kbd>пауза</span>
  </div>
</main>
<script>
"use strict";

const WIDTH = 720;
const HEIGHT = 448;
const ENDING_DURATION = 10.2;
const REVIVAL_DURATION = 10;
const CAMPAIGN_LIVES = 1;
const SURVIVAL_LIVES = 3;
const FIRST_SURVIVAL_REWARD = 5;
const SURVIVAL_REWARD_STEP = 2;
const TILT_COS = .84;
const TILT_SIN = Math.sqrt(1 - TILT_COS * TILT_COS);
const DEMO_LIMIT = 90;
const RIDE_DURATION = 25;
const RIDE_FILM_DURATION = 8.5;
const RIDE_CITY_DURATION = 12.6;
const COMMANDER_REVEAL_AT = 6.55;
const TILE = 16;
const STEP = 1 / 120;
const DASH_COOLDOWN = .82;
const BASE_AMMO_LIMIT = 16;
const TAU = Math.PI * 2;
const canvas = document.getElementById("screen");
const stage3d = document.getElementById("stage3d");

const storageKey = "glukhoy-signal-v1";
function loadRecord() {
  let saved;
  try {
    saved = JSON.parse(localStorage.getItem(storageKey)) || {};
  } catch {
    saved = {};
  }
  const inventory = Object.fromEntries(Object.keys(weapons).map(id => {
    const level = saved.inventory?.[id];
    return [id, Number.isInteger(level) ? clamp(level, Number(id === "pulse"), 3) : Number(id === "pulse")];
  }));
  return {
    score: Math.max(0, Number.isFinite(saved.score) ? saved.score : 0),
    times: Array.isArray(saved.times) ? saved.times.slice(0, levels.length) : [],
    waveBest: Math.max(0, Number.isInteger(saved.waveBest) ? saved.waveBest : 0),
    waveScore: Math.max(0, Number.isFinite(saved.waveScore) ? saved.waveScore : 0),
    survivalBest: Math.max(0, Number.isInteger(saved.survivalBest) ? saved.survivalBest : 0),
    survivalScore: Math.max(0, Number.isFinite(saved.survivalScore) ? saved.survivalScore : 0),
    credits: Number.isInteger(saved.credits) ? Math.max(0, saved.credits) : 220,
    inventory, equipped: inventory[saved.equipped] > 0 ? saved.equipped : "pulse",
    theme: Object.hasOwn(themes, saved.theme) ? saved.theme : "nerpa",
    pendingGear: Object.hasOwn(equipment, saved.pendingGear) ? saved.pendingGear : null,
    companion: Object.hasOwn(companions, saved.companion) ? saved.companion : null,
    immortal: saved.immortal === true, demoImmortal: saved.demoImmortal !== false,
    trained: saved.trained === true,
    rideUnlocked: saved.rideUnlocked === true || Number.isFinite(saved.times?.[levels.length - 1]),
    lastTransmission: ["archive", "order"].includes(saved.lastTransmission) ? saved.lastTransmission : null,
    mute: saved.mute === true
  };
}

let audio;

function wakeAudio() {
  if (record.mute) return;
  const AudioType = window.AudioContext || window.webkitAudioContext;
  if (!AudioType) return;
  try {
    if (!audio) {
      audio = new AudioType();
      const length = Math.floor(audio.sampleRate * .19);
      noiseBuffer = audio.createBuffer(1, length, audio.sampleRate);
      const data = noiseBuffer.getChannelData(0);
      for (let i = 0; i < length; i++) data[i] = Math.random() * 2 - 1;
    }
    if (audio.state === "suspended") audio.resume().catch(() => {});

    audio = undefined;
  }
}
function tone(type, from, to, duration, volume, at) {
  const osc = audio.createOscillator();
  const gain = audio.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(from, at);
  osc.frequency.exponentialRampToValueAtTime(Math.max(15, to), at + duration);
  gain.gain.setValueAtTime(volume, at);
  gain.gain.exponentialRampToValueAtTime(.0001, at + duration);
  osc.connect(gain).connect(audio.destination);
  osc.start(at);
  osc.stop(at + duration);
}

  source.buffer = noiseBuffer;
  filter.type = "highpass";
  filter.frequency.value = frequency;
  gain.gain.setValueAtTime(volume, at);
  gain.gain.exponentialRampToValueAtTime(.0001, at + duration);
  source.connect(filter).connect(gain).connect(audio.destination);
  source.start(at);
  source.stop(at + duration);
}
function sound(name) {
  if (record.mute || audio?.state !== "running") return;
  const at = audio.currentTime;
  switch (name) {
    case "fire": tone("square", 210, 58, .075, .044, at); noise(1100, .05, .06, at); break;
    case "foe": tone("triangle", 130, 73, .09, .055, at); break;
    case "hit": noise(520, .11, .13, at); tone("square", 97, 40, .1, .045, at); break;
    case "dash": noise(800, .11, .08, at); tone("triangle", 105, 350, .14, .04, at); break;
    case "dry":
      noise(2100, .026, .115, at);
      tone("triangle", 610, 245, .037, .065, at);
      noise(3350, .019, .070, at + .047);

    case "pickup": tone("sine", 450, 730, .16, .052, at); break;
    case "cinematic":

  osc.type = "sawtooth";
  osc.frequency.setValueAtTime(pitch, at);
  osc.frequency.exponentialRampToValueAtTime(pitch * rise, at + duration * .42);
  osc.frequency.exponentialRampToValueAtTime(pitch * .93, at + duration);
  gain.gain.setValueAtTime(.0001, at);
  gain.gain.exponentialRampToValueAtTime(.075, at + .055);
  gain.gain.exponentialRampToValueAtTime(.0001, at + duration);

function spawnSurvival(count) {
  const active = game.enemies.filter(hostile);
  const limit = Math.min(count, 24 - active.length);
  if (limit <= 0) return;
  const heat = threatLevel();
  const candidates = arenaSpawns
    .map(([x, y], i) => ({ x, y, order: rand(game.surge.nextId * 179 + i * 311) }))
    .filter(pos => distance(game.p, pos) > 150 && !blocked(pos.x, pos.y, 13)
      && active.every(enemy => distance(pos, enemy) > 40))
    .sort((a, b) => a.order - b.order)
    .slice(0, limit);
  for (const { x, y } of candidates) {
    const id = game.surge.nextId++;
    let kind = id % 2 === 0 ? "runner" : "guard";
    if (heat >= .55 && id % 5 === 1) kind = "burst";
    if (heat >= 1.25 && id % 5 === 3) kind = "spread";
    if (heat >= 2.25 && id % 6 === 4) kind = "heavy";
    game.enemies.push(enemyAt([x, y, kind], id, .38 + (id % 4) * .11));
  }
  if (game.enemies.length > 58) {
    game.enemies = game.enemies.filter(hostile).concat(game.enemies.filter(enemy => enemy.dead).slice(-22));
  }
  if (game.pickups.length > 48) game.pickups = game.pickups.filter(pickup => pickup.amount).slice(-36);
}

function takeHit(cause) {
  const p = game.p;
  if (game.mode !== "live" || immortal() || p.dash > 0 || p.invulnerable > 0) return;
  if (barrierReady()) {
    game.surge.shield = 22 - (rank("barrier") - 1) * 5;
    p.invulnerable = .75;
    burst(p.x, p.y, "#a9f6fc", 18, 97);
    sound("hit");
    return;
  }
  if (game.gear.armor > 0) {
    game.gear.armor--;
    p.invulnerable = .75;
    burst(p.x, p.y, "#ffe0a2", 18, 97);
    sound("hit");
    return;
  }
  if (p.shield || game.companion?.guard) {
    if (p.shield) p.shield = false;
    else {
      game.companion.guard = false;
      game.popups.push({ x: p.x, y: p.y - 17, life: 1, text: "ЩИТ ХАСКИ" });
    }
    p.invulnerable = .75;
    burst(p.x, p.y, "#a9f6fc", 18, 97);
    sound("hit");
    return;
  }
  game.losses++;
  if (usesLives()) {
    game.lives--;
    if (game.lives > 0) {
      p.invulnerable = 1.35;
      game.shake = 4;
      game.popups.push({ x: p.x, y: p.y - 16, life: .9, text: "−1 ЖИЗНЬ" });
      burst(p.x, p.y, "#ff9aab", 15, 73);
      sound("hit");
      return;
    }
  }
  burst(p.x, p.y, "#acf1d7", 25, 115);

  sound("loss");
  game.deathCause = cause;
  if (survival()) persistSurvival();
  showDeath();
}

    const gapTop = gate.center - gate.half;

        && (h.y - HACK_RADIUS < gapTop || h.y + HACK_RADIUS > gapBottom)) {

  game.shake = Math.max(0, game.shake - 22 * dt);
  for (const p of game.particles) {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= dt;
  }
  for (const trail of game.trails) trail.life -= dt;
  for (const popup of game.popups) {
    popup.y -= 27 * dt;
    popup.life -= dt;
  }
  game.particles = game.particles.filter(p => p.life > 0);
  game.trails = game.trails.filter(trail => trail.life > 0);
  game.popups = game.popups.filter(popup => popup.life > 0);
}

function drawMechBody(enemy, look, t) {
  const { phase, kind, clock, hitFlash, active } = enemy;
  const { color, plate, torso, arms } = look;
  const running = kind === "runner";
  const moving = phase === "seek" || phase === "charge";
  const stride = moving && !motion.matches ? Math.round(Math.sin(clock * (running ? 23 : 15)) * 3) : 0;
  const dark = "#101521";
  for (const side of [-1, 1]) {
    const legY = side * (torso - 2);
    const footX = -13 + side * stride;
    const armY = side * arms;
    rect(ctx, dark, footX, legY - 2, 10, 4);
    rect(ctx, plate, footX, legY - 2, 4, 4);
    rect(ctx, dark, -5, armY - 3, running ? 16 : 12, 6);
    rect(ctx, plate, -4, armY - 3, 6, 6);
    rect(ctx, color, -3, armY - 2, 3, 2);
    if (running) poly(ctx, color, [[3,armY-2],[13,armY-2],[15,armY],[4,armY+2]]);
    else rect(ctx, "#d6c6d6", 3, armY - 1, 4, 3);
  }
  poly(ctx, dark, [[-10,-torso],[2,-torso-2],[7,-torso+1],[7,torso-1],[2,torso+2],[-10,torso]]);
  rect(ctx, plate, -7, -torso + 1, 9, 2 * torso - 2);
  rect(ctx, hitFlash > 0 ? "#fff3d3" : color, -6, -2, 3, 4);
  rect(ctx, dark, 2, -5, 9, 10);
  rect(ctx, "#d7d4da", 3, -4, 6, 8);
  const visor = phase === "wind" ? "#fff2cc" : active || motion.matches || Math.sin(t * 3 + enemy.id) > -.6 ? color : "#816f80";
  rect(ctx, visor, 8, -3, 2, 2);
  rect(ctx, visor, 8, 1, 2, 2);

  if (kind === "guard") {
    rect(ctx, dark, 5, 6, 13, 5);
    rect(ctx, color, 12, 7, 6, 2);
  } else if (kind === "burst") {
    for (const side of [-1, 1]) {
      rect(ctx, dark, 5, side * 8 - 2, 14, 5);
      rect(ctx, color, 11, side * 8 - 1, 8, 2);
    }
  } else if (kind === "spread") {
    rect(ctx, dark, 4, 7, 14, 8);
    for (const dy of [0, 3, 6]) rect(ctx, color, 15, 7 + dy, 4, 1);
  } else if (kind === "heavy") {
    for (const side of [-1, 1]) {
      rect(ctx, "#594354", 1, side * 13 - 4, 16, 8);
      rect(ctx, color, 12, side * 13 - 3, 6, 6);
    }
  }
}

function sceneEase(value) {
  const x = clamp(value, 0, 1);
  return x * x * (3 - 2 * x);

function drawSignalTrace(x, y, width, time, color, amplitude) {
  ctx.beginPath();
  ctx.moveTo(x, y);
  for (let i = 3; i <= width; i += 3) {
    const envelope = Math.pow(Math.sin(Math.PI * i / width), 2);
    const pulse = Math.sin(i * .15 - time * 5) * Math.sin(i * .071 + time * 2);
    ctx.lineTo(x + i, y + pulse * envelope * amplitude);
  }
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.stroke();
}

    const handY = armY - 7 - (leader && side === 1 ? lift * 38 : 0);
    line(ctx, "#101a26", side * 13, -68, side * 33, armY + 2, 11);

function updateCinematic(dt = 0) {
  const film = game.cinematic;
  if (!film || film.finished || document.hidden) return;
  if (film.shot === "dance") {
    film.visible = Math.min(REVIVAL_DURATION, film.visible + dt);
    if (film.visible >= REVIVAL_DURATION) {
      completeRevival();
      return;
    }
    const due = Math.floor(film.visible / DANCE_BEAT);
    while (film.nextCue <= due) playDanceBeat(film.nextCue++);
    return;
  }
  const time = game.worldTime - film.started;
  if (film.duration && time >= film.duration) {
    skipFilm();
    return;
  }
  const cueList = cinematicCues[film.shot];
  if (!cueList) return;
  const darkVoice = film.shot === "guardian" || film.shot === "orders" || film.shot === "city";
  while (film.nextCue < cueList.length && time >= cueList[film.nextCue][0]) {
    const [, pitch, length, rise] = cueList[film.nextCue++];
    voiceHum(pitch, length, rise, darkVoice ? [300, 536] : [400, 800]);
  }
}

      const ay = height / 2 + (ayWorld * TILT_COS - azWorld * TILT_SIN) * yScale;
      const by = height / 2 + (byWorld * TILT_COS - bzWorld * TILT_SIN) * yScale;
      const cyScreen = height / 2 + (cyWorld * TILT_COS - czWorld * TILT_SIN) * yScale;
      const az = ayWorld * TILT_SIN + azWorld * TILT_COS;
      const bz = byWorld * TILT_SIN + bzWorld * TILT_COS;
      const cz = cyWorld * TILT_SIN + czWorld * TILT_COS;

      const maxX = Math.min(width - 1, Math.ceil(Math.max(ax, bx, cxScreen)));
      const minY = Math.max(0, Math.floor(Math.min(ay, by, cyScreen)));

          const b = ((cyScreen - ay) * sampleX + (ax - cxScreen) * sampleY) / area;

    ui.callout.dataset.kind = "dry";
    setText(ui.callout, "НЕТ ЗАРЯДОВ · КАССЕТА ИЛИ РЫВОК");
  } else if (game.hackHint > 0) {
    ui.callout.hidden = false;
    ui.callout.dataset.kind = "exit";
    setText(ui.callout, "F · НАВЕДИ ПРИЦЕЛ НА МЕХА РЯДОМ");
  } else if (nearExit) {
    ui.callout.hidden = false;
    ui.callout.dataset.kind = "exit";
    setText(ui.callout, "ШЛЮЗ ЗАБЛОКИРОВАН");
  }
}
function frame(now) {
  const dt = game.lastFrame ? Math.min(.05, (now - game.lastFrame) / 1000) : 0;
  game.lastFrame = now;
  game.worldTime += dt;
  const phase = game.mode;
  if (activePlay(phase)) {
    game.accumulator += dt;
    const tick = phase === "hack" ? updateHack : phase === "ride" ? updateRide : update;
    while (game.accumulator >= STEP && game.mode === phase) {
      tick(STEP);
      game.accumulator -= STEP;
    }
  } else game.accumulator = 0;
  updateEffects(dt);
  updateCinematic(dt);
  music();
  render(game.worldTime);
  updateHud();
  requestAnimationFrame(frame);
}

function aimFrom(event) {
  const bounds = canvas.getBoundingClientRect();
  if (!bounds.width || !bounds.height) return;
  pointer.clientX = event.clientX;
  pointer.clientY = event.clientY;
  pointer.x = (event.clientX - bounds.left) * WIDTH / bounds.width;
  pointer.y = (event.clientY - bounds.top) * HEIGHT / bounds.height;
}
function reprojectPointer() {
  if (Number.isFinite(pointer.clientX)) aimFrom(pointer);
}
function releasePointer() {
  const id = pointer.id;
  pointer.id = null;
  pointer.held = false;
  pointer.touch = false;
  if (id !== null && canvas.hasPointerCapture?.(id)) {
    try { canvas.releasePointerCapture(id); }
    catch { /* The browser may have already cancelled the physical press. */ }
  }
}
function nativePointer(event) {
  return event.isPrimary !== false && event.pointerType !== "touch";
}
function pointerDown(event) {
  if (game.mode === "hack" && event.button === 0 && event.isPrimary !== false) {
    event.preventDefault();
    liftPacket();
    return;
  }
  const riding = game.mode === "ride";
  if (riding) {
    if (event.button !== 0 || event.isPrimary === false) return;
  } else if (game.mode !== "live" || !nativePointer(event) || (event.button !== 0 && event.button !== 2)) return;
  event.preventDefault();
  aimFrom(event);
  if (!riding && (event.button === 2 || event.ctrlKey)) {
    dash();
    return;
  }
  pointer.held = true;
  pointer.touch = riding && event.pointerType === "touch";
  pointer.id = event.pointerId ?? null;
  if (pointer.id !== null) {
    try { canvas.setPointerCapture?.(pointer.id); }
    catch { /* Window listeners also handle release where pointer capture is unavailable. */ }
  }
  if (riding) shootRide();
  else triggerFire();
}
function pointerMove(event) {
  if (!nativePointer(event) && !(pointer.touch && event.pointerId === pointer.id)) return;
  aimFrom(event);
  if (game.mode === "ride") {
    if (!pointer.touch && pointer.held && !(event.buttons & 1)) releasePointer();
    return;
  }
  if (game.mode !== "live") return;
  if (pointer.held && !(event.buttons & 1)) releasePointer();
  if (event.button === 2 && (event.buttons & 2)) dash();
}
function pointerUp(event) {
  if (!nativePointer(event) && !pointer.touch) return;
  if (pointer.id !== null && event.pointerId !== pointer.id) return;
  if (event.button === 0 || !(event.buttons & 1)) releasePointer();
}
if (window.PointerEvent) {
  canvas.addEventListener("pointerdown", pointerDown);
  window.addEventListener("pointermove", pointerMove);
  window.addEventListener("pointerup", pointerUp, true);
  window.addEventListener("pointercancel", event => { if (event.pointerId === pointer.id) releasePointer(); }, true);
  canvas.addEventListener("lostpointercapture", event => { if (event.pointerId === pointer.id) releasePointer(); });
} else {
  canvas.addEventListener("mousedown", pointerDown);
  window.addEventListener("mousemove", pointerMove);
  window.addEventListener("mouseup", pointerUp, true);
}
document.documentElement.addEventListener("mouseleave", releasePointer);
window.addEventListener("resize", reprojectPointer);
window.addEventListener("scroll", reprojectPointer, { passive: true });
canvas.addEventListener("contextmenu", event => event.preventDefault());

const moveKeys = new Set(["KeyW", "KeyA", "KeyS", "KeyD", "ArrowUp", "ArrowLeft", "ArrowDown", "ArrowRight"]);
const keyFallback = {
  w: "KeyW", ц: "KeyW", a: "KeyA", ф: "KeyA", s: "KeyS", ы: "KeyS",
  d: "KeyD", в: "KeyD", j: "KeyJ", о: "KeyJ", e: "KeyE", у: "KeyE",
  r: "KeyR", к: "KeyR", p: "KeyP", з: "KeyP", m: "KeyM", ь: "KeyM", f: "KeyF", а: "KeyF",
  " ": "Space", shift: "ShiftLeft", "1": "Digit1", "2": "Digit2", "3": "Digit3", "4": "Digit4", "5": "Digit5"
};
function inputCode(event) {
  if (event.code && event.code !== "Unidentified") return event.code;
  const key = event.key || "";
  return keyFallback[key.toLowerCase()] || key;
}
window.addEventListener("keydown", event => {
  if (event.metaKey || event.ctrlKey || event.altKey || event.isComposing) return;
  const code = inputCode(event);
  if (game.mode === "hack" || game.mode === "ride") {
    if (game.mode === "hack" && ["Space", "ArrowUp", "KeyW"].includes(code)) {
      event.preventDefault();
      if (!event.repeat) liftPacket();
    } else if (game.mode === "ride" && (moveKeys.has(code) || code === "KeyJ")) {
      event.preventDefault();
      if (code === "KeyJ" && !keys.has(code)) shootRide();
      keys.add(code);
    } else if (!event.repeat && (code === "Escape" || code === "KeyP")) {
      event.preventDefault();
      pauseExtra();
    } else if (!event.repeat && code === "KeyM") toggleMute();
    return;
  }
  const live = game.mode === "live";
  if (live && (moveKeys.has(code) || code === "KeyJ")) {
    event.preventDefault();
    if (code === "KeyJ" && !keys.has(code)) triggerFire();
    keys.add(code);
    return;
  }
  if (live && code === "Space") event.preventDefault();
  if (event.repeat) return;
  if (game.mode === "revive" && (code === "Escape" || code === "Enter")) {
    event.preventDefault();
    if (code === "Escape") showDeath();
    return;
  }
  if (game.cinematic?.duration && !game.cinematic.finished && (code === "Escape" || code === "Enter")) {
    event.preventDefault();
    skipFilm();
    return;
  }
  if (code === "KeyM") toggleMute();
  if (code === "KeyR" && ["live", "dead", "pause"].includes(game.mode)) restart();
  if (code === "Enter" && !live && !(event.target instanceof HTMLButtonElement)) game.primaryAction?.();
  if (game.mode === "reward" && /^(Digit|Numpad)[1-3]$/.test(code)) {
    event.preventDefault();
    chooseReward(Number(code.at(-1)) - 1);
  }
  if (game.mode === "sectors" && /^(Digit|Numpad)[1-5]$/.test(code)) {
    event.preventDefault();
    newRun("campaign", Number(code.at(-1)) - 1);
  }
  if (game.mode === "ending" && /^(Digit|Numpad)[12]$/.test(code)) {
    event.preventDefault();
    if (code.endsWith("1")) game.primaryAction?.();
    else game.secondaryAction?.();
  }
  if (code === "Escape" || code === "KeyP") {
    if (live) pause();
    else if (game.mode === "pause") resume();
    else if (game.mode === "hackPause" || game.mode === "ridePause") game.primaryAction?.();
    else if (game.mode === "armory") game.armoryReturn?.();
    else if (game.mode === "settings") game.settingsReturn?.();
    else if (game.mode === "sectors") menu();
    else if (game.mode === "companions" && code === "Escape") game.companionsReturn?.();
    else if (game.mode === "gear" && code === "Escape") showArmory(menu);
    else if (game.mode === "hackBrief" && code === "Escape") game.secondaryAction?.();
    else if (game.mode === "story" && code === "Escape") game.primaryAction?.();
  }
  if (live && ["Space", "ShiftLeft", "ShiftRight"].includes(code)) dash();
  if (live && code === "KeyF") stunMech();
  if (live && code === "KeyE") interact();
});
window.addEventListener("keyup", event => keys.delete(inputCode(event)));
function loseFocus() {
  keys.clear();
  releasePointer();
  if (game.mode === "live") pause();
  else if (game.mode === "hack" || game.mode === "ride") pauseExtra();
}
window.addEventListener("blur", loseFocus);
document.addEventListener("visibilitychange", () => {
  if (document.hidden) loseFocus();
});
ui.primary.addEventListener("click", () => game.primaryAction?.());
ui.secondary.addEventListener("click", () => game.secondaryAction?.());
ui.tertiary.addEventListener("click", () => game.tertiaryAction?.());
ui.quaternary.addEventListener("click", () => game.quaternaryAction?.());
ui.mainMenu.addEventListener("click", () => {
  if (game.mode === "live") pause();
  else if (game.mode === "hack" || game.mode === "ride") pauseExtra();
  else if (["pause", "hackPause", "ridePause"].includes(game.mode)) ui.primary.focus({ preventScroll: true });
  else if (game.mode !== "menu") menu();
});
ui.bonusRide.addEventListener("click", () => {
  if (game.mode === "menu" && record.rideUnlocked) showRideBrief();
});
ui.companions.addEventListener("click", () => {
  if (game.mode === "menu") showCompanions(menu);
  else if (game.mode === "sectors") showCompanions(showSectorSelect);
});
ui.sound.addEventListener("click", toggleMute);
ui.settings.addEventListener("click", openSettings);
stage3d.addEventListener("webglcontextlost", event => {
  event.preventDefault();
  rendererLost = true;
  stage3d.hidden = true;
  if (renderer3d?.target === stage3d) useSoftware3d();
});
stage3d.addEventListener("webglcontextrestored", () => {
  rendererLost = false;
  rendererUnavailable = false;
  renderer3d = null;
  ensure3d();
});
if (document.fullscreenEnabled) {
  ui.fullscreen.addEventListener("click", async () => {
    try {
      if (document.fullscreenElement) await document.exitFullscreen();
      else await document.documentElement.requestFullscreen();
    } catch { ui.fullscreen.blur(); }
  });
  document.addEventListener("fullscreenchange", () => {
    ui.fullscreen.textContent = document.fullscreenElement ? "СВЕРНУТЬ" : "ПОЛНЫЙ ЭКРАН";
    reprojectPointer();
  });
} else ui.fullscreen.hidden = true;


applyTheme();
ensure3d();
menu();
requestAnimationFrame(frame);
</script>
