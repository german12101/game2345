<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Глухой сигнал</title>
<style>
:root {
  color-scheme: dark;
  --base: #0b0e13;
  --panel: #111820;
  --line: #25323b;
  --muted: #a3b6ba;
  --text: #e3efea;
  --mint: #9ef5d0;
  --ember: #ff9a76;
  --glow: #172329;
  --mono: ui-monospace,"SFMono-Regular",Consolas,monospace;
}
:root[data-theme="violet"] {
  --base: #120e1c;
  --line: #473657;
  --mint: #e5baff;
  --glow: #301e45;
}
:root[data-theme="amber"] {
  --base: #18120d;
  --line: #504031;
  --mint: #ffd18b;
  --glow: #39281a;
}
:root[data-theme="contrast"] {
  --base: #05080c;
  --line: #556471;
  --mint: #befff9;
  --glow: #1b2c36;
}
* {
  box-sizing: border-box;
}
html,body {
  margin: 0;
  min-height: 100%;
}
body {
  background: radial-gradient(ellipse at 74% 14%,var(--glow) 0%,transparent 42%),var(--base);
  color: var(--text);
  font: 14px/1.5 system-ui,sans-serif;
}
button {
  color: inherit;
  font: inherit;
  cursor: pointer;
}
button:focus-visible {
  outline: 2px solid #fff;
  outline-offset: 4px;
}
[hidden] {
  display: none!important;
}
.app {
  width: min(1120px,calc(100% - 48px));
  margin: auto;
  padding: 21px 0 15px;
}
.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 14px;
  margin-bottom: 12px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font: 700 12px var(--mono);
  letter-spacing: .15em;
  text-transform: uppercase;
  white-space: nowrap;
}
.mark {
  width: 26px;
  height: 26px;
  display: grid;
  place-items: center;
  border: 1px solid #426059;
  color: var(--mint);
  font-size: 15px;
}
.utility {
  display: flex;
  gap: 8px;
}
.quiet {
  padding: 7px 10px;
  border: 1px solid #30434b;
  background: #141d24;
  font: 700 11px var(--mono);
  white-space: nowrap;
}
.quiet:hover {
  border-color: var(--mint);
}
.hud {
  display: grid;
  grid-template-columns: 1.55fr 1fr .8fr .9fr .9fr;
  background: #121b22;
  border: 1px solid var(--line);
  border-bottom: 0;
}
.cell {
  padding: 7px 13px;
  border-right: 1px solid var(--line);
  min-width: 0;
}
.cell:last-child {
  border: 0;
}
.cell small {
  display: block;
  color: var(--muted);
  font: 600 10px var(--mono);
  letter-spacing: .10em;
  text-transform: uppercase;
}
.cell strong {
  font: 800 16px/1.2 var(--mono);
  font-variant-numeric: tabular-nums;
  display: block;
  padding-top: 3px;
  white-space: nowrap;
}
.cell .accent {
  color: var(--mint);
}
.dash-track {
  height: 3px;
  margin-top: 3px;
  background: #293b40;
  max-width: 100px;
}
.dash-fill {
  height: 100%;
  background: var(--mint);
  transform-origin: left;
}
.field {
  position: relative;
  overflow: hidden;
  border: 1px solid #395059;
  aspect-ratio: 45/28;
  background: #0d141a;
  isolation: isolate;
}
canvas {
  display: block;
  width: 100%;
  height: 100%;
  image-rendering: pixelated;
  touch-action: none;
}
#stage3d {
  position: absolute;
  inset: 0;
  pointer-events: none;
  image-rendering: auto;
}
#screen {
  position: relative;
}
#view3d[aria-pressed="true"] {
  border-color: var(--mint);
  color: var(--mint);
}
.field.live canvas {
  cursor: none;
}
.field::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: repeating-linear-gradient(0deg,#060a1028 0 1px,transparent 1px 5px);
  opacity: .28;
  z-index: 1;
}
.overlay {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  z-index: 2;
  background: #090e13a8;
  padding: 22px;
  overflow: auto;
}
.overlay[data-mode="menu"] {
  justify-items: start;
  background: linear-gradient(90deg,#0b1118 2%,#0b1118ed 31%,#0b111899 55%,#0b11181a 82%);
  padding: clamp(20px,5.6vw,78px);
}
.card {
  width: min(100%,414px);
  padding: 25px;
  border: 1px solid #49635e;
  background: #111b23f5;
  box-shadow: 0 12px 40px #0007;
}
.overlay[data-mode="menu"] .card {
  padding: 0;
  border: 0;
  background: none;
  box-shadow: none;
  width: min(100%,540px);
}
.eyebrow {
  display: flex;
  align-items: center;
  gap: 9px;
  color: var(--mint);
  font: 700 clamp(9px,1.3vw,12px) var(--mono);
  letter-spacing: .14em;
  text-transform: uppercase;
  margin: 0 0 13px;
}
.eyebrow::before {
  content: "";
  width: 20px;
  height: 2px;
  background: currentColor;
}
.overlay h1 {
  font-size: clamp(24px,5vw,47px);
  line-height: .96;
  letter-spacing: -.04em;
  margin: 0;
  white-space: pre-line;
  font-weight: 950;
}
.overlay[data-mode="menu"] h1 {
  font-size: clamp(34px,8.2vw,115px);
  line-height: .80;
  letter-spacing: -.074em;
}
.overlay[data-mode="menu"] h1 span {
  display: block;
  color: var(--mint);
}
.overlay[data-mode="dead"] .eyebrow,.overlay[data-mode="dead"] h1 {
  color: var(--ember);
}
.description {
  color: #c3d4d1;
  max-width: 41ch;
  margin: 15px 0 16px;
  font-size: clamp(12px,1.6vw,16px);
  line-height: 1.45;
}
.overlay[data-mode="menu"] .description {
  margin-top: 22px;
}
.primary,.secondary {
  padding: 9px 14px;
  min-height: 38px;
  font-weight: 850;
  font-size: 13px;
  border: 1px solid var(--mint);
  background: var(--mint);
  color: #0d1b19;
}
.primary:hover {
  background: #d4ffeb;
}
.secondary {
  background: #101820;
  border-color: #435f62;
  color: var(--text);
}
.secondary:hover {
  border-color: var(--mint);
}
.overlay[data-mode="menu"] #quaternary {
  border-color: var(--mint);
  color: var(--mint);
}
.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.hint {
  color: #a7bbbb;
  font: 11px/1.4 var(--mono);
  margin: 10px 0 0;
}
.overlay[data-mode="reward"] .card,
.overlay[data-mode="armory"] .card,
.overlay[data-mode="settings"] .card,
.overlay[data-mode="gear"] .card,
.overlay[data-mode="ending"] .card {
  width: min(100%, 620px);
}
.overlay[data-mode="story"] .card {
  width: min(100%, 550px);
  border-left: 3px solid var(--mint);
  background: linear-gradient(130deg, #1a2e33, #101923 74%);
}
.overlay[data-mode="story"] .description,
.overlay[data-mode="win"] .description {
  max-width: 52ch;
  white-space: pre-line;
}
.overlay[data-cinematic="true"] {
  justify-items: start;
  padding: clamp(16px, 3.8vw, 56px);
  background: linear-gradient(90deg, #071017ef 0%, #071017df 37%, #07101745 62%, #07101704 100%);
}
.overlay[data-cinematic="true"] .card {
  width: min(55%, 465px);
  padding: clamp(13px, 2vw, 25px);
  border: 0;
  border-left: 2px solid var(--mint);
  background: #101923d9;
  box-shadow: none;
  animation: scene-enter .23s ease-out both;
}
.overlay[data-cinematic="true"] .description {
  white-space: pre-line;
}
.overlay[data-cinematic="true"] h1 {
  font-size: clamp(19px, 3.4vw, 39px);
}
@keyframes scene-enter {
  from { opacity: .7; transform: translateX(-6px); }
  to { opacity: 1; transform: translateX(0); }
}
.overlay[data-film="playing"] {
  place-items: end end;
  padding: clamp(10px, 2.4vw, 25px);
  background: linear-gradient(180deg, transparent 70%, #0810198f);
}
.overlay[data-film="playing"] .card {
  width: auto;
  padding: 0;
  border: 0;
  background: transparent;
}
.overlay[data-film="playing"] .card > :not(.actions),
.overlay[data-film="playing"] .actions > :not(#tertiary) {
  display: none;
}
.cell .accent[data-empty="true"] {
  color: var(--ember);
}
#lives {
  color: #ff9aab;
  letter-spacing: .13em;
}
#lives[data-empty="true"] {
  color: var(--muted);
}
.overlay[data-mode="sectors"] .card {
  width: min(100%, 620px);
}
.sector-list {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
  gap: 7px;
  margin: 12px 0;
}
.sector-list .reward {
  min-height: 76px;
}
.sector-list .reward[data-status="cleared"] {
  border-color: var(--mint);
  background: #294441;
}
.sector-list .reward[data-status="available"] {
  border-color: #e7bf83;
  background: #3a3229;
}
.sector-list .reward[data-status="available"] strong {
  color: #ffe2ab;
}
.sector-list .reward:disabled {
  opacity: .58;
  cursor: default;
}
.rewards {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
  margin: 12px 0;
}
.reward {
  display: grid;
  align-content: start;
  text-align: left;
  gap: 5px;
  min-width: 0;
  padding: 11px;
  border: 1px solid #456764;
  background: #192b32;
}
.reward:hover {
  border-color: var(--mint);
  background: #233942;
}
.reward strong {
  color: var(--mint);
  font-size: 13px;
}
.reward span {
  color: #bdcfce;
  font-size: 11px;
}
.armory-list {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 7px;
  margin: 9px 0;
}
.armory-list .reward[data-equipped="true"] {
  border-color: var(--mint);
}
.armory-list button[aria-pressed="true"] {
  border-color: var(--mint);
}
.option-heading {
  grid-column: 1 / -1;
  color: var(--muted);
  font: 700 11px var(--mono);
}
.armory-list .quiet {
  white-space: normal;
  padding: 5px 7px;
}
.armory-list button:disabled {
  opacity: .6;
  cursor: default;
}
.modules {
  color: #bed4ce;
  padding: 6px 11px;
  border: 1px solid var(--line);
  border-top: 0;
  background: #10191e;
  font: 11px/1.4 var(--mono);
}
.callout {
  position: absolute;
  z-index: 1;
  pointer-events: none;
  left: 50%;
  bottom: 15px;
  transform: translateX(-50%);
  white-space: nowrap;
  background: #10211fec;
  color: var(--mint);
  border: 1px solid #72b69c;
  padding: 5px 10px;
  font: 700 clamp(9px,1.6vw,12px) var(--mono);
  box-shadow: 0 0 15px #101a20;
}
.callout[data-kind="dry"] {
  color: #ffd1b6;
  border-color: #da8c69;
  background: #291a1af2;
}
.rail {
  display: flex;
  justify-content: space-between;
  gap: 14px;
  padding: 8px 11px;
  border: 1px solid var(--line);
  border-top: 0;
  background: #111920;
  color: var(--muted);
  font: 700 11px var(--mono);
}
.rail > span:last-child {
  text-align: right;
}
.keys {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 7px 17px;
  color: #a8b8ba;
  padding: 13px 0 0;
  font-size: 11px;
}
kbd {
  font: 700 10px var(--mono);
  display: inline-block;
  color: #d9ebe4;
  border: 1px solid #344752;
  border-bottom-width: 2px;
  padding: 1px 4px;
  margin-right: 4px;
  background: #151e26;
}
@media(min-width:860px) and (max-height:900px) {
  .app {
    width: min(1120px,calc((100vh - 190px)*45/28),calc(100% - 48px));
  }
}
@media(max-width:600px) {
  .app {
    width: calc(100% - 16px);
    padding-top: 8px;
  }
  .top {
    margin-bottom: 7px;
  }
  .brand {
    font-size: 10px;
    letter-spacing: .055em;
  }
  .mark {
    width: 22px;
    height: 22px;
  }
  .utility {
    gap: 4px;
  }
  #fullscreen {
    display: none;
  }
  .quiet {
    padding: 5px 6px;
    font-size: 9px;
  }
  .cell {
    padding: 5px;
  }
  .cell small {
    font-size: 8px;
    letter-spacing: 0;
  }
  .cell strong {
    font-size: 11px;
  }
  .rail {
    font-size: 9px;
    padding: 5px;
  }
  .field {
    min-height: 215px;
  }
  .overlay {
    padding: 8px;
  }
  .card {
    padding: 12px;
  }
  .eyebrow {
    margin-bottom: 8px;
  }
  .overlay[data-mode="menu"] .description,.description {
    margin: 8px 0;
  }
  .hint {
    margin-top: 5px;
  }
  .keys {
    gap: 4px 8px;
    padding-top: 8px;
  }
  .reward {
    padding: 5px;
  }
  .reward strong {
    font-size: 10px;
  }
  .reward span {
    font-size: 9px;
  }
  .field[data-cinematic="true"] {
    min-height: 330px;
  }
  .overlay[data-cinematic="true"] {
    place-items: end stretch;
    padding: 10px;
    background: linear-gradient(180deg, #07101912, #0b141cc9 36%, #0b141cf0 70%);
  }
  .overlay[data-cinematic="true"] .card {
    width: 100%;
    padding: 11px;
  }
  .overlay[data-film="playing"] {
    place-items: end end;
    background: linear-gradient(180deg, transparent 70%, #0810198f);
  }
  .overlay[data-film="playing"] .card {
    width: auto;
    padding: 0;
  }
}
@media(prefers-reduced-motion:reduce) {
  .field::after {
    opacity: .12;
  }
  .overlay[data-cinematic="true"] .card {
    animation: none;
  }
}
</style>
</head>
<body>
<main class="app">
  <header class="top">
    <div class="brand"><span class="mark" aria-hidden="true">⌁</span> Ретранслятор «Нерпа»</div>
    <div class="utility">
      <button class="quiet" id="sound" type="button" aria-label="Переключить звук">ЗВУК ВКЛ</button>
      <button class="quiet" id="view3d" type="button" aria-label="Переключить 3D-вид" aria-pressed="false">ВИД 2D</button>
      <button class="quiet" id="settings" type="button">НАСТРОЙКИ</button>
      <button class="quiet" id="fullscreen" type="button">ПОЛНЫЙ ЭКРАН</button>
    </div>
  </header>
  <div class="hud" aria-label="Состояние игры">
    <div class="cell"><small>Сектор / Уровень</small><strong id="sector">— / 05</strong></div>
    <div class="cell"><small>Заряды</small><strong id="ammo" class="accent">—</strong></div>
    <div class="cell"><small>Жизни</small><strong id="lives" data-empty="true">—</strong></div>
    <div class="cell"><small>Очки</small><strong id="score">00000</strong></div>
    <div class="cell"><small>Рывок</small><strong id="dash">—</strong><div class="dash-track"><div id="dashFill" class="dash-fill"></div></div></div>
  </div>
  <div class="field" id="field">
    <canvas id="stage3d" aria-hidden="true" hidden></canvas>
    <canvas id="screen" width="720" height="448" aria-label="Игровое поле"></canvas>
    <div class="callout" id="callout" hidden></div>
    <div class="overlay" id="overlay" hidden>
      <div class="card" role="dialog" aria-labelledby="headline" aria-describedby="description">
        <p id="eyebrow" class="eyebrow"></p>
        <h1 id="headline"></h1>
        <p id="description" class="description"></p>
        <div class="rewards" id="rewards" aria-label="Выбор модуля" hidden></div>
        <div class="armory-list" id="armory" aria-label="Оружие" hidden></div>
        <div class="armory-list" id="options" hidden></div>
        <div class="sector-list" id="sectorList" aria-label="Секторы кампании" hidden></div>
        <div class="actions">
          <button type="button" id="primary" class="primary"></button>
          <button type="button" id="secondary" class="secondary" hidden></button>
          <button type="button" id="tertiary" class="secondary" hidden></button>
          <button type="button" id="quaternary" class="secondary" hidden></button>
        </div>
        <p id="hint" class="hint"></p>
      </div>
    </div>
  </div>
  <div class="rail"><span id="objective">Связь со станцией потеряна</span><span id="clock">РЕКОРД 00000</span></div>
  <div class="modules" id="modules" hidden></div>
  <div class="keys" aria-label="Управление">
    <span><kbd>WASD</kbd>движение</span>
    <span><kbd>ЛКМ / J</kbd>огонь</span>
    <span><kbd>ПРОБЕЛ / SHIFT</kbd>рывок по прицелу</span>
    <span id="hackControl" hidden><kbd>F → ПРОБЕЛ</kbd>перехват меха</span>
    <span><kbd>E</kbd>шлюз</span>
    <span><kbd>R</kbd>рестарт сектора</span>
    <span><kbd>ESC</kbd>пауза</span>
  </div>
</main>
<script>

const WIDTH = 720;
const HEIGHT = 448;
const ENDING_DURATION = 10.2;
const REVIVAL_DURATION = 10;
const CAMPAIGN_LIVES = 1;
const SURVIVAL_LIVES = 3;

const DEMO_LIMIT = 90;
const TILE = 16;

const canvas = document.getElementById("screen");
const stage3d = document.getElementById("stage3d");
const ctx = canvas.getContext("2d");

].map(id => [id, $(id)]));

const clamp = (v, min, max) => Math.min(max, Math.max(min, v));
const distance = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const rand = (seed) => {
  const x = Math.sin(seed * 127.1 + 79.9) * 43758.5453;
  return x - Math.floor(x);
};

function hullFor(width, height) {
  return [
    [16, 16, width - 32, 16], [16, height - 32, width - 32, 16],
    [16, 32, 16, height - 64], [width - 32, 32, 16, height - 64]

}

    ],

    enemies: [
      [160, 253, "runner"], [111, 130, "guard"], [292, 152, "runner"], [422, 88, "guard"],

    ],
    caches: [[281, 381, 5], [634, 224, 5]]
  },
  {
    name: "Машзал", time: 32, ammo: 9, start: [82, 68], exit: [640, 369],
    tone: ["#30252b", "#423139", "#674b4e", "#ffb27b", "#503435"],
    walls: [
      [32, 146, 136, 16], [239, 146, 168, 16], [391, 32, 16, 114],
      [153, 232, 16, 184], [250, 316, 273, 16], [507, 198, 16, 118],
      [495, 111, 193, 16], [585, 234, 103, 16]
    ],
    props: [
      [133, 48, 41, 46, "crate"], [266, 61, 58, 38, "reactor"],
      [48, 214, 64, 30, "rack"], [56, 326, 38, 42, "crate"],

function spawnSurvival(count) {
  const active = game.enemies.filter(hostile);
  const limit = Math.min(count, 24 - active.length);
  if (limit <= 0) return;
  const heat = threatLevel();
  const candidates = arenaSpawns
    .map(([x, y], i) => ({ x, y, order: rand(game.surge.nextId * 179 + i * 311) }))
    .filter(pos => distance(game.p, pos) > 150 && !blocked(pos.x, pos.y, 13)
      && active.every(enemy => distance(pos, enemy) > 40))
    .sort((a, b) => a.order - b.order)
    .slice(0, limit);
  for (const { x, y } of candidates) {
    const id = game.surge.nextId++;
    let kind = id % 2 === 0 ? "runner" : "guard";
    if (heat >= .55 && id % 5 === 1) kind = "burst";
    if (heat >= 1.25 && id % 5 === 3) kind = "spread";
    if (heat >= 2.25 && id % 6 === 4) kind = "heavy";
    game.enemies.push(enemyAt([x, y, kind], id, .38 + (id % 4) * .11));
  }
  if (game.enemies.length > 58) {
    game.enemies = game.enemies.filter(hostile).concat(game.enemies.filter(enemy => enemy.dead).slice(-22));
  }
  if (game.pickups.length > 48) game.pickups = game.pickups.filter(pickup => pickup.amount).slice(-36);
}

  if (game.gear.armor > 0) {

    sound("hit");
    return;
  }
  if (p.shield) {
    p.shield = false;
    p.invulnerable = .75;
    burst(p.x, p.y, "#a9f6fc", 18, 97);
    sound("hit");
    return;
  }
  game.losses++;
  if (usesLives()) {

      p.invulnerable = 1.35;

      game.popups.push({ x: p.x, y: p.y - 16, life: .9, text: "−1 ЖИЗНЬ" });
      burst(p.x, p.y, "#ff9aab", 15, 73);

function drawAim(x, y, angle, reach, start, color) {
  const dx = Math.cos(angle);
  const dy = Math.sin(angle);
  let clear = 0;
  let end = reach;
  if (sight(x, y, x + dx * end, y + dy * end)) clear = end;
  else {
    while (end - clear > 3) {
      const m = (end + clear) / 2;
      if (sight(x, y, x + dx * m, y + dy * m)) clear = m;
      else end = m;
    }
  }
  if (clear <= start) return;
  ctx.setLineDash([5, 5]);
  line(ctx, color, x + dx * start, y + dy * start, x + dx * clear, y + dy * clear);
  ctx.setLineDash([]);
}

function drawSignalTrace(x, y, width, time, color, amplitude) {
  ctx.beginPath();
  ctx.moveTo(x, y);
  for (let i = 3; i <= width; i += 3) {
    const envelope = Math.pow(Math.sin(Math.PI * i / width), 2);
    const pulse = Math.sin(i * .15 - time * 5) * Math.sin(i * .071 + time * 2);
    ctx.lineTo(x + i, y + pulse * envelope * amplitude);
  }
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.stroke();
}

function updateCinematic(dt = 0) {
  const film = game.cinematic;
  if (!film || film.finished || document.hidden) return;
  if (film.shot === "dance") {
    film.visible = Math.min(REVIVAL_DURATION, film.visible + dt);
    if (film.visible >= REVIVAL_DURATION) {
      completeRevival();
      return;
    }
    const due = Math.floor(film.visible / DANCE_BEAT);
    while (film.nextCue <= due) playDanceBeat(film.nextCue++);
    return;
  }
  const time = game.worldTime - film.started;
  if (film.duration && time >= film.duration) {
    skipFilm();
    return;
  }
  const cueList = cinematicCues[film.shot];
  if (!cueList) return;
  const darkVoice = film.shot === "guardian" || film.shot === "orders";
  while (film.nextCue < cueList.length && time >= cueList[film.nextCue][0]) {
    const [, pitch, length, rise] = cueList[film.nextCue++];
    voiceHum(pitch, length, rise, darkVoice ? [300, 536] : [400, 800]);
  }
}

  }
  ui.hackControl.hidden = !game.level || briefing || !canHack();
  if (!game.level || briefing) {
    const sector = briefing
      ? demo() ? "ДЕМО" : tutorial() ? "ОБУЧЕНИЕ" : `0${game.briefIndex + 1} / 05  ${levels[game.briefIndex].name}`
      : "— / 05";
    setText(ui.sector, sector);
    setText(ui.ammo, "—");
    ui.ammo.dataset.empty = "false";
    setText(ui.dash, "—");
    setText(ui.score, scoreText(briefing ? game.score : 0));
    const selected = equipment[record.pendingGear];
    const weapon = demo() && briefing ? "Веер ур. 2" : `${weapons[record.equipped].name} ур. ${record.inventory[record.equipped]}`;
    setText(ui.objective, `Оружие · ${weapon}` + (!briefing && selected ? "  •  " + selected.name : ""));
    setText(ui.clock, `КАМПАНИЯ ${scoreText(record.score)}  •  ВЫЖИВАНИЕ ${record.survivalBest}`);
    ui.dashFill.style.transform = "scaleX(0)";
    ui.callout.hidden = true;
    ui.modules.hidden = true;
    return;
  }
  const p = game.p;
  const foes = game.enemies.filter(hostile).length;
  const campaign = game.run === "campaign";
  const sector = survival() ? `УРОВЕНЬ ${game.surge.level}` : demo() ? "ДЕМО" : tutorial() ? "ОБУЧЕНИЕ" : `0${game.stage + 1} / 05  ${game.level.name}`;
  setText(ui.sector, sector);
  setText(ui.ammo, unlimitedAmmo() ? "∞" : `${String(p.ammo).padStart(2, "0")} / ${ammoLimit()}`);
  ui.ammo.dataset.empty = String(!hasAmmo());
  setText(ui.score, scoreText(game.score));
  setText(ui.dash, p.cooldown > 0 ? Math.max(.1, p.cooldown).toFixed(1) + " С" : "ГОТОВ");
  ui.dashFill.style.transform = `scaleX(${clamp(1 - p.cooldown / dashCooldown(), 0, 1)})`;
  const bossStatus = game.enemies.find(enemy => enemy.kind === "boss" && !enemy.dead);
  const target = bossStatus
    ? `Смотритель: ${bossStatus.phase === "open" ? "уязвим" : "под щитом"} · ${bossStatus.health}/${bossStatus.maxHealth}`
    : `Мехов ${foes}`;
  const objective = tutorial() ? `Шаг ${game.training.step + 1} / ${trainingPrompts.length}`
    : survival() ? `Уничтожено ${game.surge.kills} · До модуля ${Math.max(0, game.surge.nextReward - game.surge.kills)}`
    : game.open ? "Шлюз открыт" : target;
  setText(ui.objective, objective);
  const clock = demo() ? `ОСТАЛОСЬ ${timeText(Math.max(0, DEMO_LIMIT - game.elapsed))}`
    : survival() ? `${timeText(game.elapsed)}  •  РЕКОРД ${record.survivalBest}`
    : tutorial() ? "" : `${timeText(game.elapsed)}  •  РЕКОРД ${scoreText(record.score)}`;
  setText(ui.clock, clock);
  const active = (survival() ? survivalModules : modules).filter(module => rank(module.id)).map(module => {
    if (module.id === "shield" && !p.shield) return "Предохранитель (расход)";
    if (module.id === "barrier" && !barrierReady()) return `Энергощит · ${Math.ceil(game.surge.shield)} с`;
    return module.name + (rank(module.id) > 1 ? " ×" + rank(module.id) : "");
  });
  const loadout = `${game.weapon.name} · ур. ${game.weapon.level}`;
  if (game.gear.time > 0) active.unshift(`${equipment[game.gear.id].name} · ${Math.ceil(game.gear.time)} с`);
  if (game.gear.id === "armor") active.unshift(`Броня ${game.gear.armor}/2`);
  if (canHack()) active.unshift(game.hackTimer > 0 ? `F · ${Math.ceil(game.hackTimer)} с` : "F · Оглушение готово");
  if (immortal() && !tutorial()) active.unshift("Бессмертие");
  setText(ui.modules, [loadout, ...active].join("  •  "));
  ui.modules.hidden = false;
  ui.callout.hidden = true;
  if (game.mode !== "live") return;
  if (tutorial()) {
    ui.callout.hidden = false;
    ui.callout.dataset.kind = "exit";
    setText(ui.callout, trainingPrompts[game.training.step]);
    return;
  }
  let nearExit = false;
  if (!survival()) {
    const [x, y] = game.level.exit;
    nearExit = Math.hypot(p.x - x, p.y - y) < 30 && sight(p.x, p.y, x, y);
    if (nearExit && game.open) {
      ui.callout.hidden = false;
      ui.callout.dataset.kind = "exit";
      const final = demo() || (campaign && game.stage === levels.length - 1);
      setText(ui.callout, final ? "E  ВЫБРАТЬ ПЕРЕДАЧУ" : "E  ПРОЙТИ ШЛЮЗ");
      return;
    }
  }
  if (!hasAmmo() && p.dryFeedback > 0) {
    ui.callout.hidden = false;
    ui.callout.dataset.kind = "dry";
    setText(ui.callout, "НЕТ ЗАРЯДОВ · КАССЕТА ИЛИ РЫВОК");
  } else if (game.hackHint > 0) {
    ui.callout.hidden = false;
    ui.callout.dataset.kind = "exit";
    setText(ui.callout, "F · НАВЕДИ ПРИЦЕЛ НА МЕХА РЯДОМ");
  } else if (nearExit) {
    ui.callout.hidden = false;
    ui.callout.dataset.kind = "exit";
    setText(ui.callout, "ШЛЮЗ ЗАБЛОКИРОВАН");
  }
}
function frame(now) {
  const dt = game.lastFrame ? Math.min(.05, (now - game.lastFrame) / 1000) : 0;
  game.lastFrame = now;
  game.worldTime += dt;
  if (game.mode === "live") {
    game.accumulator += dt;
    while (game.accumulator >= STEP && game.mode === "live") {
      update(STEP);
      game.accumulator -= STEP;
    }
  } else game.accumulator = 0;
  updateEffects(dt);
  updateCinematic(dt);
  music();
  render(game.worldTime);
  updateHud();
  requestAnimationFrame(frame);
}

function aimFrom(event) {
  const bounds = canvas.getBoundingClientRect();
  if (!bounds.width || !bounds.height) return;
  pointer.clientX = event.clientX;
  pointer.clientY = event.clientY;
  pointer.x = (event.clientX - bounds.left) * WIDTH / bounds.width;
  pointer.y = (event.clientY - bounds.top) * HEIGHT / bounds.height;
}
function reprojectPointer() {
  if (Number.isFinite(pointer.clientX)) aimFrom(pointer);
}
function releasePointer() {
  const id = pointer.id;
  pointer.id = null;
  pointer.held = false;
  if (id !== null && canvas.hasPointerCapture?.(id)) {
    try { canvas.releasePointerCapture(id); }
    catch { /* The browser may have already cancelled the physical press. */ }
  }
}
function nativePointer(event) {
  return event.isPrimary !== false && event.pointerType !== "touch";
}
function pointerDown(event) {
  if (game.mode !== "live" || !nativePointer(event) || (event.button !== 0 && event.button !== 2)) return;
  event.preventDefault();
  aimFrom(event);
  if (event.button === 2 || event.ctrlKey) {
    dash();
    return;
  }
  pointer.held = true;
  pointer.id = event.pointerId ?? null;
  if (pointer.id !== null) {
    try { canvas.setPointerCapture?.(pointer.id); }
    catch { /* Window listeners also handle release where pointer capture is unavailable. */ }
  }
  triggerFire();
}
function pointerMove(event) {
  if (!nativePointer(event)) return;
  aimFrom(event);
  if (game.mode !== "live") return;
  if (pointer.held && !(event.buttons & 1)) releasePointer();
  if (event.button === 2 && (event.buttons & 2)) dash();
}
function pointerUp(event) {
  if (!nativePointer(event)) return;
  if (pointer.id !== null && event.pointerId !== pointer.id) return;
  if (event.button === 0 || !(event.buttons & 1)) releasePointer();
}
if (window.PointerEvent) {
  canvas.addEventListener("pointerdown", pointerDown);
  window.addEventListener("pointermove", pointerMove);
  window.addEventListener("pointerup", pointerUp, true);
  window.addEventListener("pointercancel", event => { if (event.pointerId === pointer.id) releasePointer(); }, true);
  canvas.addEventListener("lostpointercapture", event => { if (event.pointerId === pointer.id) releasePointer(); });
} else {
  canvas.addEventListener("mousedown", pointerDown);
  window.addEventListener("mousemove", pointerMove);
  window.addEventListener("mouseup", pointerUp, true);
}
document.documentElement.addEventListener("mouseleave", releasePointer);
window.addEventListener("resize", reprojectPointer);
window.addEventListener("scroll", reprojectPointer, { passive: true });
canvas.addEventListener("contextmenu", event => event.preventDefault());

const moveKeys = new Set(["KeyW", "KeyA", "KeyS", "KeyD", "ArrowUp", "ArrowLeft", "ArrowDown", "ArrowRight"]);
const keyFallback = {
  w: "KeyW", ц: "KeyW", a: "KeyA", ф: "KeyA", s: "KeyS", ы: "KeyS",
  d: "KeyD", в: "KeyD", j: "KeyJ", о: "KeyJ", e: "KeyE", у: "KeyE",
  r: "KeyR", к: "KeyR", p: "KeyP", з: "KeyP", m: "KeyM", ь: "KeyM", f: "KeyF", а: "KeyF",
  " ": "Space", shift: "ShiftLeft", "1": "Digit1", "2": "Digit2", "3": "Digit3", "4": "Digit4", "5": "Digit5"
};
function inputCode(event) {
  if (event.code && event.code !== "Unidentified") return event.code;
  const key = event.key || "";
  return keyFallback[key.toLowerCase()] || key;
}
window.addEventListener("keydown", event => {
  if (event.metaKey || event.ctrlKey || event.altKey || event.isComposing) return;
  const code = inputCode(event);
  const live = game.mode === "live";
  if (live && (moveKeys.has(code) || code === "KeyJ")) {
    event.preventDefault();
    if (code === "KeyJ" && !keys.has(code)) triggerFire();
    keys.add(code);
    return;
  }
  if (live && code === "Space") event.preventDefault();
  if (event.repeat) return;
  if (game.mode === "revive" && (code === "Escape" || code === "Enter")) {
    event.preventDefault();
    if (code === "Escape") showDeath();
    return;
  }
  if (game.cinematic?.duration && !game.cinematic.finished && (code === "Escape" || code === "Enter")) {
    event.preventDefault();
    skipFilm();
    return;
  }
  if (code === "KeyM") toggleMute();
  if (code === "KeyR" && ["live", "dead", "pause"].includes(game.mode)) restart();
  if (code === "Enter" && !live && !(event.target instanceof HTMLButtonElement)) game.primaryAction?.();
  if (game.mode === "reward" && /^(Digit|Numpad)[1-3]$/.test(code)) {
    event.preventDefault();
    chooseReward(Number(code.at(-1)) - 1);
  }
  if (game.mode === "sectors" && /^(Digit|Numpad)[1-5]$/.test(code)) {
    event.preventDefault();
    newRun("campaign", Number(code.at(-1)) - 1);
  }
  if (game.mode === "ending" && /^(Digit|Numpad)[12]$/.test(code)) {
    event.preventDefault();
    if (code.endsWith("1")) game.primaryAction?.();
    else game.secondaryAction?.();
  }
  if (code === "Escape" || code === "KeyP") {
    if (live) pause();
    else if (game.mode === "pause") resume();
    else if (game.mode === "armory") game.armoryReturn?.();
    else if (game.mode === "settings") game.settingsReturn?.();
    else if (game.mode === "sectors") menu();
    else if (game.mode === "gear" && code === "Escape") showArmory(menu);
    else if (game.mode === "story" && code === "Escape") game.primaryAction?.();
  }
  if (live && ["Space", "ShiftLeft", "ShiftRight"].includes(code)) dash();
  if (live && code === "KeyF") stunMech();
  if (live && code === "KeyE") interact();
});
window.addEventListener("keyup", event => keys.delete(inputCode(event)));
function loseFocus() {
  keys.clear();
  releasePointer();
  if (game.mode === "live") pause();
}
window.addEventListener("blur", loseFocus);
document.addEventListener("visibilitychange", () => {
  if (document.hidden) loseFocus();
});
ui.primary.addEventListener("click", () => game.primaryAction?.());
ui.secondary.addEventListener("click", () => game.secondaryAction?.());
ui.tertiary.addEventListener("click", () => game.tertiaryAction?.());
ui.quaternary.addEventListener("click", () => game.quaternaryAction?.());
ui.sound.addEventListener("click", toggleMute);
ui.settings.addEventListener("click", openSettings);
ui.view3d.addEventListener("click", toggleView3d);
stage3d.addEventListener("webglcontextlost", event => {
  event.preventDefault();
  rendererLost = true;
  stage3d.hidden = true;
  refreshView3d();
});
stage3d.addEventListener("webglcontextrestored", () => {
  rendererLost = false;
  rendererUnavailable = false;
  renderer3d = null;
  if (record.view === "3d") ensure3d();
  refreshView3d();
});
if (document.fullscreenEnabled) {
  ui.fullscreen.addEventListener("click", async () => {
    try {
      if (document.fullscreenElement) await document.exitFullscreen();
      else await document.documentElement.requestFullscreen();
    } catch { ui.fullscreen.blur(); }
  });
  document.addEventListener("fullscreenchange", () => {
    ui.fullscreen.textContent = document.fullscreenElement ? "СВЕРНУТЬ" : "ПОЛНЫЙ ЭКРАН";
    reprojectPointer();
  });
} else ui.fullscreen.hidden = true;


applyTheme();
if (record.view === "3d") ensure3d();
refreshView3d();
menu();
requestAnimationFrame(frame);
</script>
</body>
